    html += '</div>';
  }

  // ── SECTION 1b: Power-Law Dispersion Models ────────────────
  const dm = ec.dispersion_models;
  if(dm){
    html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #dc3545;padding-bottom:0.4rem;color:#dc3545;">Dispersion Scaling: Power-Law Models</h2>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">Fits <code>s\u00b2 = A + B \u00b7 x<sup>C</sup></code> where A is the undiversifiable floor, B is the diversifiable scale, and C &isin; (&minus;1, 0) is the power of diversification. Monotonically decreasing by construction.</p>';

    // Single-factor H chart
    if(dm.single_h && dm.single_h.status==='fitted' && dm.single_h.fitted_curve_display){
      html += '<div class="card"><h3>Power-Law Dispersion: s\u00b2 = A + B\u00b7H<sup>C</sup></h3>';
      html += '<p style="color:#6c757d;font-size:0.9rem;">Fits variance (s\u00b2) as a monotonically decreasing power-law in diversification. A = undiversifiable floor, C &isin; (&minus;1, 0) = strength of mix diversification.</p>';
      html += '<div class="chart-container"><canvas id="chart-disp-h"></canvas></div>';
      const m = dm.single_h;
      html += '<p style="color:#6c757d;font-size:0.85rem;">Parameters estimated on '+(m.n_bins||10)+' decile means. Winsorised at p95 (cap='+fmt(m.winsorise_cap,4)+').</p>';
      html += makeTable(['Param','Value','p-value'],[
        ['A (variance floor)', fmt(m.A,6)+ci95(m.A,m.se_A,0), m.p_A!=null?fmt(m.p_A,6):'—'],
        ['B (concentration scale)', fmt(m.B,6)+ci95(m.B,m.se_B,0), m.p_B!=null?fmt(m.p_B,6):'—'],
        ['C (power)', fmtC(m, true), m.p_C!=null?fmt(m.p_C,6):'—'],
        ['R\u00b2 (decile means)', fmt(m.r_squared,4), ''],
        ['R\u00b2 (observation-level)', fmt(m.r_squared_obs,4), ''],
        ['Interpretation', 'Doubling diversification (1\u2212HHI) multiplies variance by '+fmt(Math.pow(2,-(m.display_C||m.C)),2)+'\u00d7', ''],
      ]);
      html += '</div>';
    }


    html += '</div>';
  }

  // ── SECTION 2: Per-LoB Dispersion Parameters ────────────────
  if(ec.lob_dispersion && ec.lob_dispersion.parameters){
    const ld = ec.lob_dispersion;
    html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #dee2e6;padding-bottom:0.4rem;">Per-LoB Dispersion Parameters</h2>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">Estimates per-LoB variance contribution &sigma;\u00b2<sub>\u2113</sub> via NNLS: s\u00b2 &asymp; &Sigma; w<sub>\u2113</sub> &middot; &sigma;\u00b2<sub>\u2113</sub>. Higher values mean that LoB contributes more volatility per unit of mix weight. R\u00b2 = '+fmt(ld.r_squared,4)+'.</p>';
    html += '<div class="card"><h3>LoB Variance Contributions</h3>';
    html += '<div class="chart-container"><canvas id="chart-lob-disp"></canvas></div>';
    const sorted = [...ld.parameters].sort((a,b)=>(b.sigma2||0)-(a.sigma2||0));
    const ldHeaders = ['LoB','Variance (s2)','Active obs','Interpretation'];
    const ldRows = sorted.map(d=>[
      esc(d.lob), fmt(d.sigma2,6), d.n_active,
      d.sigma2 > 0.03 ? '<span style="color:#dc3545;">High volatility LoB</span>' :
      d.sigma2 > 0.01 ? '<span style="color:#ff7f0e;">Moderate</span>' :
      '<span style="color:#28a745;">Low volatility LoB</span>'
    ]);
    html += makeTable(ldHeaders, ldRows);
    html += '</div>';
  }

  el.innerHTML = html;

  // ── Draw HHI scatter ──────────────────────────────────────
  if(ec.hhi_scatter && ec.hhi_scatter.points && ec.hhi_scatter.points.length > 1){
    const pts = ec.hhi_scatter.points;
    const scatterData = pts.map(p=>({x:p.x, y:p.y, syndicate:p.syndicate, year:p.year}));
    const xs = scatterData.map(d=>d.x).sort((a,b)=>a-b);
    const xmin = xs[0], xmax = xs[xs.length-1];

    const datasets = [{
      label:'Observations', data:scatterData,
      backgroundColor:'rgba(108,117,125,0.3)', borderColor:'transparent',
      pointRadius:3, pointHoverRadius:5
    }];

    // Mean regression line
    const dir = ec.hhi_scatter.direction || {};
    if(dir.intercept!=null && dir.beta!=null){
      datasets.push({
        label:'Mean (OLS)', data:[{x:xmin,y:dir.intercept+dir.beta*xmin},{x:xmax,y:dir.intercept+dir.beta*xmax}],
        type:'scatter', showLine:true, borderColor:C('standardised'), backgroundColor:'transparent',
        pointRadius:0, borderWidth:2
      });
    }

    // Binned empirical quantiles
    const qb = ec.hhi_scatter.quantile_bins;
    if(qb && qb.length > 1){
      datasets.push({
        label:'90th percentile', data:qb.map(b=>({x:b.x, y:b.q90})),
        type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent',
        pointRadius:3, borderWidth:2, borderDash:[6,3], tension:0.3
      });
      datasets.push({
        label:'10th percentile', data:qb.map(b=>({x:b.x, y:b.q10})),
        type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent',
        pointRadius:3, borderWidth:2, borderDash:[6,3], tension:0.3
      });
    }

    makeChart('chart-hhi-scatter',{
      type:'scatter',
      data:{ datasets },
      options:{
        responsive:true,
        plugins:{ tooltip:{
          backgroundColor:'#333', cornerRadius:6,
          callbacks:{ label:ctx=>{
            const d = ctx.raw;
            return (d.syndicate?'Syn '+d.syndicate:'')+(d.year?' ('+d.year+')':'')+' x:'+fmt(d.x,2)+' y:'+fmt(d.y,2);
          }}
        }},
        scales:{
          x:{ title:{display:true, text:'Diversification (1 \u2212 HHI)'} },
          y:{ title:{display:true, text:'PYD Severity'} }
        },
        onClick:(evt, elems)=>{
          if(elems.length && elems[0].datasetIndex===0){
            const d = scatterData[elems[0].index];
            showSelection('hsc','<p>Syndicate: '+esc(d.syndicate)+', Year: '+esc(d.year)+', x: '+fmt(d.x,3)+', y: '+fmt(d.y,3)+'</p>');
          }
        }
      }
    });
  }

  // ── Draw mix dispersion power-law chart ──────────────────
  if(dm && dm.single_h && dm.single_h.status==='fitted' && dm.single_h.fitted_curve_display && ec.hhi_scatter && ec.hhi_scatter.points){
    const pts = ec.hhi_scatter.points;
    const scData = pts.map(p=>({x:Math.max(p.x,0.01), y:p.y*p.y}));
    const hDsets = [
      { label:'Observations (s\u00b2)', data:scData, backgroundColor:'rgba(108,117,125,0.2)', borderColor:'transparent', pointRadius:2, pointHoverRadius:4 },
      { label:'Fitted (decile means)', data:dm.single_h.fitted_curve_display.map(p=>({x:p.x,y:p.y})), type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent', pointRadius:0, borderWidth:2.5, tension:0.4 }
    ];
    // Add bin means (transform from HHI to 1-HHI for display)
    if(dm.single_h.bin_points && dm.single_h.bin_points.length){
      hDsets.push({ label:'Bin means', data:dm.single_h.bin_points.map(p=>({x:1-p.x,y:p.y})), backgroundColor:C('raw'), borderColor:C('raw'), pointRadius:5, pointHoverRadius:7 });
    }
    makeChart('chart-disp-h',{
      type:'scatter', data:{ datasets:hDsets },
      options:{ responsive:true,
        plugins:{ tooltip:{ backgroundColor:'#333', cornerRadius:6 }},
        scales:{ x:{ title:{display:true, text:'Diversification (1 \u2212 HHI)'} }, y:{ type:'sqrt', title:{display:true, text:'s\u00b2 (squared severity, \u221a scale)'}, min:0 } }
      }
    });
  }

  // ── Draw LoB dispersion bar chart ─────────────────────────
  if(ec.lob_dispersion && ec.lob_dispersion.parameters){
    const params = [...ec.lob_dispersion.parameters].sort((a,b)=>(b.sigma2||0)-(a.sigma2||0));
    const labels = params.map(d=>d.lob);
    const values = params.map(d=>d.sigma2||0);
    makeChart('chart-lob-disp',{
      type:'bar',
      data:{ labels, datasets:[{ label:'\u03C3\u00b2 (variance contribution)', data:values, backgroundColor:values.map(v=>v>0.03?'#dc3545':v>0.01?'#ff7f0e':'#28a745') }] },
      options:{ indexAxis:'y', responsive:true,
        plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'#333', cornerRadius:6 }},
        scales:{ x:{ title:{display:true, text:'Per-LoB variance (\u03C3\u00b2)'}, min:0 } }
      }
    });
  }

}

// ============================================================
// TAB 6: Joint Composition
// ============================================================
function renderTabJoint(){
  const el = document.getElementById('tab-content-6');
  const jc = DATA.joint_composition;
  if(!jc){ noData(el); return; }

  let html = '';

  // ── HHI vs R correlation scatter ───────────────────────────
  const corr = jc.hhi_r_correlation;
  if(corr && corr.scatter_points && corr.scatter_points.length > 1){
    html += '<h2 style="margin:1.5rem 0 0.5rem;border-bottom:2px solid #dee2e6;padding-bottom:0.4rem;">Size vs Diversification Correlation</h2>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">Are larger syndicates also more diversified? If so, fitting size and HHI simultaneously will produce unstable estimates \u2014 the model cannot distinguish whether lower variance comes from being larger or from being more diversified. A significant correlation here motivates the sequential approach below.</p>';
    html += '<div class="card"><h3>Diversification (1 &minus; HHI) vs Reserve Size</h3>';
    html += '<div class="chart-container"><canvas id="chart-hhi-r-corr"></canvas></div>';
    html += makeTable(['Metric','Value','p-value'],[
      ['Pearson (linear) correlation', fmt(corr.pearson_r,4), corr.p_pearson!=null?fmt(corr.p_pearson,6):'\u2014'],
      ['Spearman (rank) correlation', fmt(corr.spearman_r,4), corr.p_spearman!=null?fmt(corr.p_spearman,6):'\u2014'],
      ['n', corr.n, ''],
    ]);
    const sig = (corr.p_pearson!=null && corr.p_pearson<0.05) || (corr.p_spearman!=null && corr.p_spearman<0.05);
    if(sig){
      html += '<p style="margin-top:0.5rem;color:#dc3545;font-weight:600;">Significant correlation \u2014 size and diversification are confounded. Sequential adjustment is necessary.</p>';
    } else {
      html += '<p style="margin-top:0.5rem;color:#28a745;">No significant correlation \u2014 size and diversification are approximately independent.</p>';
    }
    html += '</div>';
  }

  // ── Univariate model comparison ────────────────────────────
  const uc = jc.univariate_comparison;
  if(uc && uc.size_r2_obs!=null && uc.hhi_r2_obs!=null){
    html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #dee2e6;padding-bottom:0.4rem;">Univariate Model Comparison: Size vs HHI</h2>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">Before the sequential pipeline, we compare how much variance each factor explains on its own (fitting s\u00b2 = A + B\u00b7x<sup>C</sup> independently). This identifies the dominant driver and informs which factor should be removed first.</p>';
    html += '<div class="card"><h3>Single-Factor Explanatory Power</h3>';
    html += makeTable(['Metric','Size Model (R)','HHI Model','Winner'],[
      ['R\u00b2 (observation-level)', fmt(uc.size_r2_obs,4), fmt(uc.hhi_r2_obs,4), uc.better_univariate==='size'?'\u2713 Size':'\u2713 HHI'],
      ['R\u00b2 (vigintile means)', fmt(uc.size_r2_binned,4), fmt(uc.hhi_r2_binned,4), ''],
      ['AIC', fmt(uc.size_aic,1), fmt(uc.hhi_aic,1), uc.size_aic<uc.hhi_aic?'\u2713 Size':'\u2713 HHI'],
      ['p-value (LR test vs null)', uc.size_p_C!=null?fmt(uc.size_p_C,6):'\u2014', uc.hhi_p_C!=null?fmt(uc.hhi_p_C,6):'\u2014', ''],
    ]);
    const r2Diff = uc.r2_difference;
    const betterLabel = uc.better_univariate==='size'?'Reserve size':'LoB concentration (HHI)';
    if(r2Diff < 0.005){
      html += '<p style="margin-top:0.5rem;color:#6c757d;"><strong>Verdict:</strong> Both univariate models explain similar variance (R\u00b2 difference = '+fmt(r2Diff,4)+'). Neither factor clearly dominates on its own.</p>';
    } else {
      html += '<p style="margin-top:0.5rem;color:#17a2b8;font-weight:600;">'+betterLabel+' explains more variance as a univariate predictor (R\u00b2 difference = '+fmt(r2Diff,4)+').</p>';
    }
    html += '</div>';
  }

  // ── Pipeline description ───────────────────────────────────
  html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #dee2e6;padding-bottom:0.4rem;">Approach A: Size-First Sequential Pipeline</h2>';
  html += '<p style="color:#6c757d;margin-bottom:1rem;">Remove the size effect first, then estimate the incremental HHI effect on the residuals. This follows the logic of partial regression (Frisch-Waugh-Lovell), removing the dominant, well-identified effect first.</p>';

  html += '<div class="card"><h3>Pipeline Steps</h3>';
  html += '<ol style="margin:0.5rem 0;">';
  html += '<li><strong>Size adjustment:</strong> s\u00b2 scaled to reference size ('+fmt(jc.reference_size,0)+' \u00a3m) using s\u00b2<sub>adj</sub> = s\u00b2 \u00d7 V(R<sub>ref</sub>) / V(R<sub>i</sub>)</li>';
  html += '<li><strong>HHI dispersion fit:</strong> s\u00b2<sub>adj</sub> = A + B\u00b7HHI<sup>C</sup> on size-adjusted residuals</li>';
  html += '</ol></div>';

  // ── Variance attribution ───────────────────────────────────
  if(jc.variance_attribution){
    const va = jc.variance_attribution;
    html += '<div class="card"><h3>Variance Attribution</h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">How much cross-sectional variance in s\u00b2 is explained at each pipeline stage.</p>';
    html += makeTable(['Stage','Var(s\u00b2)','% Explained'],[
      ['Raw (unadjusted)', fmt(va.var_raw_sq,6), '\u2014'],
      ['After size adjustment', fmt(va.var_after_size_adj,6), fmt(va.pct_explained_by_size,1)+'%'],
      ['After HHI fit on residuals', va.var_after_hhi_adj!=null?fmt(va.var_after_hhi_adj,6):'\u2014', va.pct_explained_by_hhi!=null?fmt(va.pct_explained_by_hhi,1)+'%':'\u2014'],
    ]);
    html += '</div>';
  }

  // ── Size-adjusted HHI scatter ──────────────────────────────
  if(jc.scatter_points && jc.scatter_points.length > 1){
    html += '<div class="card"><h3>Size-Adjusted s\u00b2 vs Diversification (1 &minus; HHI)</h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">Each observation\'s s\u00b2 has been scaled to the reference reserve size. The fitted curve shows the incremental HHI effect after size is removed.</p>';
    html += '<div class="chart-container"><canvas id="chart-joint-hhi"></canvas></div></div>';
  }

  // ── HHI model parameters ──────────────────────────────────
  const dh = jc.disp_h_adjusted;
  if(dh && dh.status==='fitted'){
    html += '<div class="card"><h3>HHI Dispersion (After Size Adjustment): s\u00b2<sub>adj</sub> = A + B\u00b7HHI<sup>C</sup></h3>';
    html += '<p style="color:#6c757d;font-size:0.85rem;">Parameters estimated on '+(dh.n_bins||20)+' vigintile means. Winsorised at p95 (cap='+fmt(dh.winsorise_cap,4)+').</p>';
    html += makeTable(['Param','Value','p-value'],[
      ['A (residual variance floor)', fmt(dh.A,6)+ci95(dh.A,dh.se_A,0), dh.p_A!=null?fmt(dh.p_A,6):'\u2014'],
      ['B (concentration scale)', fmt(dh.B,6)+ci95(dh.B,dh.se_B,0), dh.p_B!=null?fmt(dh.p_B,6):'\u2014'],
      ['C (power)', fmtC(dh, true), dh.p_C!=null?fmt(dh.p_C,6):'\u2014'],
      ['R\u00b2 (vigintile means)', fmt(dh.r_squared,4), ''],
      ['R\u00b2 (observation-level)', fmt(dh.r_squared_obs,4), ''],
      ['Interpretation', 'Doubling diversification (1\u2212HHI) multiplies residual variance by '+fmt(Math.pow(2,-(dh.display_C||dh.C)),2)+'\u00d7', ''],
    ]);
    html += '</div>';
  }

  // ── Combined scaling model ──────────────────────────────────
  const sm = jc.size_model_used;
  if(sm && dh && dh.status==='fitted'){
    html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #28a745;padding-bottom:0.4rem;color:#28a745;">Combined Dispersion Scaling Model</h2>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">Combining the size power-law with the residual HHI fit gives a single formula for predicting PYD variance as a function of both reserve size and LoB concentration.</p>';

    html += '<div class="card">';
    html += '<h3>s\u00b2(R, HHI) = V<sub>size</sub>(R) &times; V<sub>hhi</sub>(HHI) / V<sub>hhi</sub>(HHI<sub>ref</sub>)</h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">where:</p>';
    html += '<ul style="color:#6c757d;font-size:0.9rem;margin:0.5rem 0;">';
    html += '<li>V<sub>size</sub>(R) = '+fmt(sm.A,6)+' + '+fmt(sm.B,6)+' &times; R<sup>'+fmt(sm.C,3)+'</sup></li>';
    html += '<li>V<sub>hhi</sub>(HHI) = '+fmt(dh.A,6)+' + '+fmt(dh.B,6)+' &times; HHI<sup>'+fmt(dh.C,3)+'</sup></li>';
    // Reference HHI = market median
    const medHHI = jc.median_hhi || 0.4;
    html += '<li>HHI<sub>ref</sub> = '+fmt(medHHI,3)+' (market median HHI)</li>';
    html += '</ul>';

    // Worked examples
    html += '<h4 style="margin-top:1rem;">Worked Examples</h4>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">Predicted standard deviation of PYD severity (= &radic;s\u00b2) for selected portfolio profiles:</p>';
    const examples = [
      {label:'Small concentrated', R:100, HHI:0.8},
      {label:'Small diversified', R:100, HHI:0.3},
      {label:'Medium concentrated', R:500, HHI:0.8},
      {label:'Medium diversified', R:500, HHI:0.3},
      {label:'Large concentrated', R:2000, HHI:0.8},
      {label:'Large diversified', R:2000, HHI:0.3},
    ];
    const vSizeRef = sm.A + sm.B * Math.pow(jc.reference_size, sm.C);
    const exRows = examples.map(e=>{
      const vSize = sm.A + sm.B * Math.pow(e.R, sm.C);
      const vHhi = dh.A + dh.B * Math.pow(e.HHI, dh.C);
      // Normalise HHI component relative to a reference (median HHI ~ 0.4)
      const vHhiRef = dh.A + dh.B * Math.pow(medHHI, dh.C);
      const s2 = vSize * (vHhi / vHhiRef);
      const sd = Math.sqrt(Math.max(s2, 0));
      return [esc(e.label), fmt(e.R,0)+' m', fmt(e.HHI,1), fmt(vSize,6), fmt(vHhi,6), fmt(s2,6), fmt(sd*100,1)+'%'];
    });
    html += makeTable(['Profile','Reserves','HHI','V_size','V_hhi','s\u00b2','SD (PYD%)'], exRows);

    // Size ratio and HHI ratio
    const sizeRatio = (sm.A + sm.B * Math.pow(100, sm.C)) / (sm.A + sm.B * Math.pow(2000, sm.C));
    const hhiRatio = (dh.A + dh.B * Math.pow(0.8, dh.C)) / (dh.A + dh.B * Math.pow(0.3, dh.C));
    html += '<div style="margin-top:0.75rem;padding:0.75rem;background:#f8f9fa;border-radius:4px;">';
    html += '<strong>Key ratios:</strong><br>';
    html += 'Variance ratio (100m vs 2000m reserves): '+fmt(sizeRatio,2)+'x<br>';
    html += 'Variance ratio (HHI=0.8 vs HHI=0.3): '+fmt(hhiRatio,2)+'x<br>';
    html += 'Combined (small concentrated vs large diversified): '+fmt(sizeRatio*hhiRatio,2)+'x';
    html += '</div>';

    html += '</div>';
  }

  // ── HHI-first pipeline ──────────────────────────────────────
  const hf = jc.hhi_first;
  if(hf && hf.disp_h_raw){
    html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #6610f2;padding-bottom:0.4rem;color:#6610f2;">Approach B: HHI-First Sequential Pipeline</h2>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">Remove the HHI (concentration) effect first, then estimate the incremental size effect on the residuals. Comparing with Approach A reveals whether the ordering matters.</p>';

    html += '<div class="card"><h3>Pipeline Steps</h3>';
    html += '<ol style="margin:0.5rem 0;">';
    html += '<li><strong>HHI adjustment:</strong> s\u00b2 scaled to reference HHI ('+fmt(hf.reference_hhi,3)+' = market median) using s\u00b2<sub>adj</sub> = s\u00b2 \u00d7 V<sub>hhi</sub>(HHI<sub>ref</sub>) / V<sub>hhi</sub>(HHI<sub>i</sub>)</li>';
    html += '<li><strong>Size dispersion fit:</strong> s\u00b2<sub>adj</sub> = A + B\u00b7R<sup>C</sup> on HHI-adjusted residuals</li>';
    html += '</ol></div>';

    // Variance attribution
    if(hf.variance_attribution){
      const va2 = hf.variance_attribution;
      html += '<div class="card"><h3>Variance Attribution (HHI-First)</h3>';
      html += '<p style="color:#6c757d;font-size:0.9rem;">How much cross-sectional variance in s\u00b2 is explained at each pipeline stage.</p>';
      html += makeTable(['Stage','Var(s\u00b2)','% Explained'],[
        ['Raw (unadjusted)', fmt(va2.var_raw_sq,6), '\u2014'],
        ['After HHI adjustment', fmt(va2.var_after_hhi_adj,6), fmt(va2.pct_explained_by_hhi,1)+'%'],
        ['After size fit on residuals', va2.var_after_size_adj!=null?fmt(va2.var_after_size_adj,6):'\u2014', va2.pct_explained_by_size!=null?fmt(va2.pct_explained_by_size,1)+'%':'\u2014'],
      ]);
      html += '</div>';
    }

    // HHI-adjusted scatter plot (y = HHI-adj s², x = R)
    if(hf.scatter_points && hf.scatter_points.length > 1){
      html += '<div class="card"><h3>HHI-Adjusted s\u00b2 vs Reserve Size</h3>';
      html += '<p style="color:#6c757d;font-size:0.9rem;">Each observation\'s s\u00b2 has been scaled to the reference HHI. The fitted curve shows the incremental size effect after HHI is removed.</p>';
      html += '<div class="chart-container"><canvas id="chart-hhi-first-size"></canvas></div></div>';
    }

    // Size model parameters (after HHI adjustment)
    const dr2 = hf.disp_r_on_residuals;
    if(dr2 && dr2.status==='fitted'){
      html += '<div class="card"><h3>Size Dispersion (After HHI Adjustment): s\u00b2<sub>adj</sub> = A + B\u00b7R<sup>C</sup></h3>';
      html += '<p style="color:#6c757d;font-size:0.85rem;">Parameters estimated on '+(dr2.n_bins||20)+' vigintile means. Winsorised at p95 (cap='+fmt(dr2.winsorise_cap,4)+').</p>';
      html += makeTable(['Param','Value','p-value'],[
        ['A (residual variance floor)', fmt(dr2.A,6)+ci95(dr2.A,dr2.se_A,0), dr2.p_A!=null?fmt(dr2.p_A,6):'\u2014'],
        ['B (size scale)', fmt(dr2.B,6)+ci95(dr2.B,dr2.se_B,0), dr2.p_B!=null?fmt(dr2.p_B,6):'\u2014'],
        ['C (power)', fmtC(dr2, false), dr2.p_C!=null?fmt(dr2.p_C,6):'\u2014'],
        ['R\u00b2 (vigintile means)', fmt(dr2.r_squared,4), ''],
        ['R\u00b2 (observation-level)', fmt(dr2.r_squared_obs,4), ''],
      ]);
      html += '</div>';
    }
  }

  // ── Ordering comparison ────────────────────────────────────
  const oc = jc.ordering_comparison;
  if(oc && oc.total_explained_size_first!=null && oc.total_explained_hhi_first!=null){
    html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #fd7e14;padding-bottom:0.4rem;color:#fd7e14;">Pipeline Ordering Diagnostics</h2>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">Does the order in which we remove effects matter? If the two factors are truly independent, the total explained variance should be identical regardless of ordering. A difference indicates confounding \u2014 the factor removed first "absorbs" some of the second factor\'s effect.</p>';

    html += '<div class="card"><h3>Total Variance Explained by Ordering</h3>';
    html += makeTable(['Pipeline','Step 1 (% explained)','Step 2 (incremental %)','Total Explained (%)'],[
      ['A: Size \u2192 HHI',
        'Size: '+fmt(oc.size_first_incremental_size,1)+'%',
        'HHI: '+(oc.size_first_incremental_hhi!=null?fmt(oc.size_first_incremental_hhi,1)+'%':'\u2014'),
        fmt(oc.total_explained_size_first,1)+'%'],
      ['B: HHI \u2192 Size',
        'HHI: '+(oc.hhi_first_incremental_hhi!=null?fmt(oc.hhi_first_incremental_hhi,1)+'%':'\u2014'),
        'Size: '+(oc.hhi_first_incremental_size!=null?fmt(oc.hhi_first_incremental_size,1)+'%':'\u2014'),
        fmt(oc.total_explained_hhi_first,1)+'%'],
    ]);

    // Difference and recommendation
    const diffAbs = Math.abs(oc.difference_pp);
    let recColor, recIcon;
    if(oc.recommendation==='equivalent'){ recColor='#28a745'; recIcon='\u2248'; }
    else if(oc.recommendation==='size_first'){ recColor='#007bff'; recIcon='A'; }
    else { recColor='#6610f2'; recIcon='B'; }

    html += '<div style="margin-top:0.75rem;padding:0.75rem;background:#f8f9fa;border-radius:4px;border-left:4px solid '+recColor+';">';
    html += '<strong>Difference:</strong> '+fmt(diffAbs,1)+' percentage points<br>';
    html += '<strong style="color:'+recColor+';">Recommendation: '+oc.recommendation_reason+'</strong>';
    html += '</div>';

    html += '</div>';
  }

  // ── Joint model (simultaneous fit) ─────────────────────────
  const dm = DATA.exposure_composition && DATA.exposure_composition.dispersion_models;
  if(dm && (dm.joint || dm.joint_no_intercept)){
    html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #6c757d;padding-bottom:0.4rem;color:#6c757d;">Robustness: Simultaneous Fits</h2>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">The simultaneous models fit size and HHI jointly. Due to collinearity, individual parameter estimates are unstable and significance is diluted \u2014 even though the overall models are significant (LR test). These are shown for completeness; the sequential pipeline above is the primary result.</p>';
  }
  if(dm && dm.joint && dm.joint.status==='fitted'){
    const m = dm.joint;
    html += '<div class="card"><h3>With Intercept: s\u00b2 = A + B\u2081\u00b7HHI<sup>C\u2081</sup> + B\u2082\u00b7R<sup>C\u2082</sup></h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">A \u2248 0 suggests no undiversifiable variance floor \u2014 motivating the no-intercept variant below.</p>';
    function fmtJC(val, ciArr, note){
      let s = fmt(val,3);
      if(ciArr && ciArr[0]!=null && ciArr[1]!=null) s += ' <span style="color:#6c757d;">['+fmt(ciArr[0],3)+', '+fmt(ciArr[1],3)+']</span>';
      if(note) s += ' <span style="color:#ff7f0e;font-size:0.85em;">'+esc(note)+'</span>';
      return s;
    }
    html += makeTable(['Param','Value','p-value'],[
      ['A (undiversifiable floor)', fmt(m.A,6)+ci95(m.A,m.se_A,0), m.p_A!=null?fmt(m.p_A,6):'\u2014'],
      ['B\u2081 (concentration scale)', fmt(m.B1,6)+ci95(m.B1,m.se_B1,0), m.p_B1!=null?fmt(m.p_B1,6):'\u2014'],
      ['C\u2081 (concentration power)', fmtJC(m.C1, m.c1_ci_95, m.c1_ci_note), m.p_model!=null?'':'\u2014'],
      ['B\u2082 (size scale)', fmt(m.B2,6)+ci95(m.B2,m.se_B2,0), m.p_B2!=null?fmt(m.p_B2,6):'\u2014'],
      ['C\u2082 (size power)', fmtJC(m.C2, m.c2_ci_95, m.c2_ci_note), ''],
      ['R\u00b2', fmt(m.r_squared,4), ''],
      ['Model LR test', '', m.p_model!=null?fmt(m.p_model,6):'\u2014'],
    ]);
    if(dm.stability_flags && dm.stability_flags.length){
      html += '<div style="margin-top:0.75rem;padding:0.5rem;background:#fff3cd;border-radius:4px;">';
      dm.stability_flags.forEach(f=>{ html += '<p style="margin:0.25rem 0;color:#856404;">\u26a0 '+esc(f)+'</p>'; });
      html += '</div>';
    }
    html += '</div>';
  }

  // No-intercept joint model
  const mni = dm && dm.joint_no_intercept;
  if(mni && mni.status==='fitted'){
    html += '<div class="card"><h3>Without Intercept: s\u00b2 = B\u2081\u00b7HHI<sup>C\u2081</sup> + B\u2082\u00b7R<sup>C\u2082</sup></h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">Constrains A=0 (no undiversifiable floor). All variance is attributable to concentration and size. Same collinearity limitations apply.</p>';
    function fmtJCni(val, ciArr, note){
      let s = fmt(val,3);
      if(ciArr && ciArr[0]!=null && ciArr[1]!=null) s += ' <span style="color:#6c757d;">['+fmt(ciArr[0],3)+', '+fmt(ciArr[1],3)+']</span>';
      if(note) s += ' <span style="color:#ff7f0e;font-size:0.85em;">'+esc(note)+'</span>';
      return s;
    }
    html += makeTable(['Param','Value','p-value'],[
      ['B\u2081 (concentration scale)', fmt(mni.B1,6)+ci95(mni.B1,mni.se_B1,0), mni.p_B1!=null?fmt(mni.p_B1,6):'\u2014'],
      ['C\u2081 (concentration power)', fmtJCni(mni.C1, mni.c1_ci_95, mni.c1_ci_note), ''],
      ['B\u2082 (size scale)', fmt(mni.B2,6)+ci95(mni.B2,mni.se_B2,0), mni.p_B2!=null?fmt(mni.p_B2,6):'\u2014'],
      ['C\u2082 (size power)', fmtJCni(mni.C2, mni.c2_ci_95, mni.c2_ci_note), ''],
      ['R\u00b2', fmt(mni.r_squared,4), ''],
      ['Model LR test', '', mni.p_model!=null?fmt(mni.p_model,6):'\u2014'],
    ]);
    html += '</div>';
  }

  el.innerHTML = html;

  // ── Draw HHI vs R correlation scatter ─────────────────────
  if(corr && corr.scatter_points && corr.scatter_points.length > 1){
    const corrData = corr.scatter_points.map(p=>({x:p.x, y:p.y, syndicate:p.syndicate, year:p.year}));
    makeChart('chart-hhi-r-corr',{
      type:'scatter',
      data:{ datasets:[{
        label:'Observations', data:corrData,
        backgroundColor:'rgba(108,117,125,0.3)', borderColor:'transparent',
        pointRadius:3, pointHoverRadius:5
      }]},
      options:{ responsive:true,
        plugins:{ tooltip:{ backgroundColor:'#333', cornerRadius:6,
          callbacks:{ label:ctx=>{ const d=ctx.raw; return (d.syndicate?'Syn '+d.syndicate:'')+(d.year?' ('+d.year+')':'')+' div:'+fmt(d.x,2)+' R:'+fmt(d.y,0); }}
        }},
        scales:{
          x:{ title:{display:true, text:'Diversification (1 \u2212 HHI)'} },
          y:{ title:{display:true, text:'Opening Reserves (\u00a3m)'} }
        }
      }
    });
  }

  // ── Draw joint HHI scatter ────────────────────────────────
  if(jc.scatter_points && jc.scatter_points.length > 1){
    const scData = jc.scatter_points.map(p=>({x:p.x, y:p.y_adj_sq, syndicate:p.syndicate, year:p.year}));
    const datasets = [{
      label:'Size-adjusted s\u00b2', data:scData,
      backgroundColor:'rgba(108,117,125,0.2)', borderColor:'transparent',
      pointRadius:2, pointHoverRadius:4
    }];

    if(dh && dh.status==='fitted' && dh.fitted_curve_display){
      datasets.push({
        label:'Fitted (vigintile means)', data:dh.fitted_curve_display.map(p=>({x:p.x,y:p.y})),
        type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent',
        pointRadius:0, borderWidth:2.5, tension:0.4
      });
    }

    if(dh && dh.bin_points && dh.bin_points.length){
      datasets.push({ label:'Bin means', data:dh.bin_points.map(p=>({x:1-p.x,y:p.y})), backgroundColor:C('raw'), borderColor:C('raw'), pointRadius:5, pointHoverRadius:7 });
    }

    const qb = jc.quantile_bins_adj;
    if(qb && qb.length > 1){
      datasets.push({
        label:'90th pctl (adj)', data:qb.map(b=>({x:b.x, y:b.q90})),
        type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent',
        pointRadius:0, borderWidth:1.5, borderDash:[6,3], tension:0.3
      });
      datasets.push({
        label:'10th pctl (adj)', data:qb.map(b=>({x:b.x, y:b.q10})),
        type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent',
        pointRadius:0, borderWidth:1.5, borderDash:[6,3], tension:0.3
      });
    }

    makeChart('chart-joint-hhi',{
      type:'scatter', data:{ datasets },
      options:{ responsive:true,
        plugins:{ tooltip:{ backgroundColor:'#333', cornerRadius:6,
          callbacks:{ label:ctx=>{ const d=ctx.raw; return (d.syndicate?'Syn '+d.syndicate:'')+(d.year?' ('+d.year+')':'')+' s\u00b2_adj:'+fmt(d.y,4); }}
        }},
        scales:{
          x:{ title:{display:true, text:'Diversification (1 \u2212 HHI)'} },
          y:{ type:'sqrt', title:{display:true, text:'Size-adjusted s\u00b2 (\u221a scale)'}, min:0 }
        }
      }
    });
  }

  // ── Draw HHI-first scatter (HHI-adjusted s² vs R) ─────────
  if(hf && hf.scatter_points && hf.scatter_points.length > 1){
    const hfData = hf.scatter_points.map(p=>({x:p.x, y:p.y_adj_sq, syndicate:p.syndicate, year:p.year}));
    const hfDatasets = [{
      label:'HHI-adjusted s\u00b2', data:hfData,
      backgroundColor:'rgba(102,16,242,0.2)', borderColor:'transparent',
      pointRadius:2, pointHoverRadius:4
    }];

    const dr2 = hf.disp_r_on_residuals;
    if(dr2 && dr2.status==='fitted' && dr2.fitted_curve){
      hfDatasets.push({
        label:'Fitted (vigintile means)', data:dr2.fitted_curve.map(p=>({x:p.x,y:p.y})),
        type:'scatter', showLine:true, borderColor:'#6610f2', backgroundColor:'transparent',
        pointRadius:0, borderWidth:2.5, tension:0.4
      });
    }

    if(dr2 && dr2.bin_points && dr2.bin_points.length){
      hfDatasets.push({ label:'Bin means', data:dr2.bin_points.map(p=>({x:p.x,y:p.y})), backgroundColor:'#6610f2', borderColor:'#6610f2', pointRadius:5, pointHoverRadius:7 });
    }

    makeChart('chart-hhi-first-size',{
      type:'scatter', data:{ datasets:hfDatasets },
      options:{ responsive:true,
        plugins:{ tooltip:{ backgroundColor:'#333', cornerRadius:6,
          callbacks:{ label:ctx=>{ const d=ctx.raw; return (d.syndicate?'Syn '+d.syndicate:'')+(d.year?' ('+d.year+')':'')+' s\u00b2_adj:'+fmt(d.y,4); }}
        }},
        scales:{
          x:{ title:{display:true, text:'Opening Reserves (\u00a3m)'} },
          y:{ type:'sqrt', title:{display:true, text:'HHI-adjusted s\u00b2 (\u221a scale)'}, min:0 }
        }
      }
    });
  }
}

// TAB 7: Capital Impact
// ============================================================
function renderTab7(){
  const el = document.getElementById('tab-content-7');
  const ci = DATA.capital_impact;
  if(!ci){ noData(el); return; }
  const portfolios = ci.portfolios || [];
  if(!portfolios.length){ noData(el); return; }

  let html = '';

  // Portfolio definitions
  html += '<div class="card"><h3>Test Portfolio Definitions</h3>';
  html += '<div class="info-msg">These portfolios define hypothetical LoB mixes and reserve sizes used to assess capital distortion from composition and scale.</div>';
  const wHeaders = ['Portfolio','Size (£m)'];
  const lobNames = DATA.analysis_config?.lob_names || DATA.meta?.lob_names || [];
  const shortLobs = lobNames.map(l => l.replace('Reinsurance — ','RI-').substring(0,12));
  shortLobs.forEach(l => wHeaders.push(l));
  const wRows = portfolios.filter(p=>p.target_weights).map(p=>{
    const row = [esc(p.name), fmt(p.size,0)];
    const tw = p.target_weights;
    lobNames.forEach(l => {
      const v = tw[l] || tw[l.replace('—','–')] || 0;
      row.push(v > 0 ? pct(v) : '-');
    });
    return row;
  });
  if(wRows.length){
    html += '<div style="overflow-x:auto;">' + makeTable(wHeaders, wRows) + '</div>';
  }
  html += '</div>';

  // Table for VaR 99.5%
  html += '<div class="card"><h3>Capital Impact — VaR 99.5%</h3>';
  const headers = ['Portfolio','Naive VaR','Mix-Adj VaR','Full-Adj VaR','Shapley Mix','Shapley Size','Boot CI'];
  const rows995 = portfolios.map(p=>{
    const sh = p.shapley || {};
    const bci = p.boot_ci || {};
    return [
      esc(p.name),
      fmt(p.naive?.var_995, 2),
      fmt(p.mix_only?.var_995, 2),
      fmt(p.full?.var_995, 2),
      fmt(sh.mix_995 ?? sh.mix, 4),
      fmt(sh.size_995 ?? sh.size, 4),
      bci.var_995? '['+fmt(bci.var_995[0],2)+', '+fmt(bci.var_995[1],2)+']':'N/A'
    ];
  });
  html += makeTable(headers, rows995);
  html += '</div>';

  // Table for VaR 99%
  html += '<div class="card"><h3>Capital Impact — VaR 99%</h3>';
  const rows99 = portfolios.map(p=>{
    const sh = p.shapley || {};
    const bci = p.boot_ci || {};
    return [
      esc(p.name),
      fmt(p.naive?.var_99, 2),
      fmt(p.mix_only?.var_99, 2),
      fmt(p.full?.var_99, 2),
      fmt(sh.mix_99 ?? sh.mix, 4),
      fmt(sh.size_99 ?? sh.size, 4),
      bci.var_99? '['+fmt(bci.var_99[0],2)+', '+fmt(bci.var_99[1],2)+']':'N/A'
    ];
  });
  html += makeTable(headers, rows99);
  html += '</div>';

  // Decomposition chart
  html += '<div class="card"><h3>Capital Decomposition</h3><div class="chart-container"><canvas id="chart-cap-decomp"></canvas></div>'+selectedObsCard('cap')+'</div>';

  el.innerHTML = html;

  // Waterfall decomposition
  const names = portfolios.map(p=>p.name);
  const naiveVals = portfolios.map(p=> p.naive?.var_995 ?? 0);
  const mixEffects = portfolios.map(p=> p.shapley?.mix_995 ?? p.shapley?.var_995?.mix_effect ?? 0);
  const sizeEffects = portfolios.map(p=> p.shapley?.size_995 ?? p.shapley?.var_995?.size_effect ?? 0);
  const fullVals = portfolios.map(p=> p.full?.var_995 ?? 0);

  // For waterfall: each segment starts where previous ended
  // Segment 1: Naive (base)
  // Segment 2: Mix effect (starts at naive, goes to naive+mix)
  // Segment 3: Size effect (starts at naive+mix, goes to full)
  const mixBases = naiveVals.slice();
  const sizeBases = naiveVals.map((n,i)=> n + mixEffects[i]);

  makeChart('chart-cap-decomp',{
    type:'bar',
    data:{
      labels: names,
      datasets:[
        { label:'Naive VaR 99.5%', data:naiveVals, backgroundColor:C('raw'), borderWidth:1, borderColor:C('raw') },
        { label:'Mix Effect (Shapley)', data:mixEffects.map((v,i)=>[mixBases[i], mixBases[i]+v]), backgroundColor:mixEffects.map(v=> v<0?'rgba(39,174,96,0.7)':'rgba(231,76,60,0.7)'), borderWidth:1, borderColor:mixEffects.map(v=> v<0?C('favourable'):C('adverse')) },
        { label:'Size Effect (Shapley)', data:sizeEffects.map((v,i)=>[sizeBases[i], sizeBases[i]+v]), backgroundColor:sizeEffects.map(v=> v>=0?'rgba(255,127,14,0.7)':'rgba(77,175,74,0.7)'), borderWidth:1, borderColor:sizeEffects.map(v=> v>=0?C('sizePenalty'):C('sizeCredit')) },
        { label:'Full-Adjusted VaR', data:fullVals.map(v=>[v-0.002,v+0.002]), backgroundColor:'#000', borderColor:'#000', borderWidth:2 }
      ]
    },
    options:{
      indexAxis:'y', responsive:true,
      plugins:{
        tooltip:{ backgroundColor:'#333', cornerRadius:6,
          callbacks:{ label:function(ctx){
            const i = ctx.dataIndex;
            if(ctx.datasetIndex===0) return 'Naive VaR: '+fmt(naiveVals[i],4);
            if(ctx.datasetIndex===1) return 'Mix Effect: '+fmt(mixEffects[i],4);
            if(ctx.datasetIndex===2) return 'Size Effect: '+fmt(sizeEffects[i],4);
            return 'Full VaR: '+fmt(fullVals[i],4);
          }}
        },
        legend:{ position:'bottom' }
      },
      scales:{ x:{ title:{display:true, text:'VaR 99.5%'} }, y:{} }
    }
  });
}

// ============================================================
// TAB 6: Robustness
// ============================================================
function renderTab8(){
  const el = document.getElementById('tab-content-8');
  const rob = DATA.robustness;
  if(!rob){ noData(el); return; }

  let html = '';

  // Sampling table
  if(rob.sampling){
    html += '<div class="card"><h3>Sampling Robustness</h3>';
    const samp = rob.sampling;
    const entries = Object.entries(samp);
    const headers = ['Metric','Estimate','Leave-out CV','Boot CV','Stability'];
    const rows = entries.map(([k,v])=>[
      esc(k), fmt(v.estimate,4), fmt(v.leave_out_cv,4), fmt(v.boot_cv,4), stabilityBadge(v.stability)
    ]);
    html += makeTable(headers, rows);
    html += '</div>';
  }

  // Local donor
  if(rob.local_donor){
    html += '<div class="card"><h3>Local-Donor Sensitivity</h3>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;">The mix-standardisation procedure projects every syndicate\u2019s LoB-level severities onto the query portfolio\u2019s weight vector. This uses the full market pool regardless of how different a donor syndicate\u2019s composition is from the target. The local-donor test checks whether restricting the donor pool to syndicates whose LoB mix is \u201cclose\u201d to the target (measured by Hellinger distance \u2264 h<sub>max</sub>) materially changes the tail estimate.</p>';
    html += '<p style="color:#6c757d;margin-bottom:1rem;"><strong>Interpretation:</strong> If VaR 99.5% is stable as h<sub>max</sub> shrinks (i.e.\u00a0the donor pool tightens), the full-market projection is robust \u2014 distant donors are not distorting the result. If VaR shifts sharply at small h<sub>max</sub>, composition-distant syndicates may introduce bias and a tighter donor radius should be considered. The \u201cadjusted\u201d column applies both mix and size\u2009/\u2009HHI scaling; the \u201craw\u201d column uses unweighted severity from donors.</p>';
    const ld = rob.local_donor;
    const keys = Object.keys(ld);

    // Table
    keys.forEach(k=>{
      const arr = ld[k];
      if(!Array.isArray(arr) || arr.length===0) return;
      html += '<h4>'+esc(k)+'</h4>';
      const headers = ['h_max','n_donors','VaR 99.5% Raw','VaR 99.5% Adjusted'];
      const rows = arr.map(r=>[
        r.h_max, r.n_donors,
        r.var_995_raw != null ? fmt(r.var_995_raw,4) : (r.n_donors > 0 ? '&lt; 5 obs' : '-'),
        r.var_995_adjusted != null ? fmt(r.var_995_adjusted,4) : (r.n_donors > 0 ? '&lt; 5 obs' : '-')
      ]);
      html += makeTable(headers, rows);
    });

    // Convergence chart
    html += '<div class="chart-container"><canvas id="chart-ld-conv"></canvas></div>';
    html += '</div>';

    el.innerHTML = html;

    // Draw convergence
    const datasets = [];
    let colorIdx = 0;
    const palette = [C('raw'), C('standardised'), C('favourable'), C('adverse'), C('sizePenalty'), '#9b59b6'];
    keys.forEach(k=>{
      const arr = ld[k];
      if(!Array.isArray(arr) || arr.length < 2) return;
      datasets.push({
        label:k+' (adjusted)', data:arr.map(r=>({x:r.h_max||r.n_donors, y:r.var_995_adjusted})),
        borderColor:palette[colorIdx%palette.length], backgroundColor:'transparent',
        showLine:true, pointRadius:3, tension:0.2
      });
      colorIdx++;
    });
    if(datasets.length){
      makeChart('chart-ld-conv',{
        type:'scatter',
        data:{ datasets },
        options:{
          responsive:true,
          plugins:{ tooltip:{ backgroundColor:'#333', cornerRadius:6 }, legend:{position:'bottom'} },
          scales:{ x:{title:{display:true, text:'h_max / n_donors'}}, y:{title:{display:true, text:'VaR 99.5% Adjusted'}} }
        }
      });
    }
  } else {
    el.innerHTML = html;
  }
}

// ============================================================
// TABS 7-9: Persona pages
// ============================================================
function renderTabPersona(personaKey, tabIdx){
  const el = document.getElementById('tab-content-'+tabIdx);
  if(!DATA.personas || !DATA.personas[personaKey]){ noData(el); return; }
  const p = DATA.personas[personaKey];
  const palette = ['#2166ac','#b2182b','#27ae60','#e74c3c','#ff7f0e','#9b59b6','#4daf4a','#17a2b8','#ffd700','#6c757d','#e91e63','#00bcd4','#795548'];

  let html = '';

  // Attributes card
  html += '<div class="card"><h3>'+esc(personaKey.charAt(0).toUpperCase()+personaKey.slice(1))+' Persona</h3>';
  if(p.definition && typeof p.definition === 'object'){
    const defRows = [];
    if(p.definition.reserves != null) defRows.push(['Reserves', esc(p.definition.reserves)]);
    if(p.definition.hhi != null) defRows.push(['HHI', fmt(p.definition.hhi, 4)]);
    if(p.definition.diversification != null) defRows.push(['Diversification', fmt(p.definition.diversification, 4)]);
    if(p.definition.complexity != null) defRows.push(['Complexity', fmt(p.definition.complexity, 4)]);
    Object.entries(p.definition).forEach(([k,v])=>{
      if(!['reserves','hhi','diversification','complexity'].includes(k)){
        defRows.push([esc(k), esc(typeof v==='object'?JSON.stringify(v):v)]);
      }
    });
    if(defRows.length) html += makeTable(['Attribute','Value'], defRows);
  } else if(p.definition){
    html += '<p style="margin-bottom:12px;">'+esc(typeof p.definition==='string'?p.definition:JSON.stringify(p.definition))+'</p>';
  }
  if(p.hhi != null) html += '<p style="margin-top:8px;"><strong>HHI:</strong> '+fmt(p.hhi, 4)+'</p>';

  // LoB weights stacked bar
  if(p.lob_weights){
    const lw = p.lob_weights;
    const entries = Object.entries(lw);
    const total = entries.reduce((s,[,v])=>s+v, 0);
    html += '<h4 style="margin-top:12px;">LoB Weights</h4>';
    html += '<div class="stacked-bar-h" style="height:32px;">';
    entries.forEach(([lob,w], i)=>{
      const pctW = (w/total*100);
      if(pctW > 2) html += '<div style="width:'+pctW+'%;background:'+palette[i%palette.length]+'" title="'+esc(lob)+': '+pct(w/total)+'">'+esc(lob.substring(0,4))+'</div>';
      else html += '<div style="width:'+pctW+'%;background:'+palette[i%palette.length]+'" title="'+esc(lob)+': '+pct(w/total)+'"></div>';
    });
    html += '</div>';
    html += '<div style="font-size:11px;margin-top:4px;">';
    entries.forEach(([lob,w],i)=> html += '<span style="margin-right:10px;"><span style="display:inline-block;width:10px;height:10px;background:'+palette[i%palette.length]+';border-radius:2px;margin-right:3px;"></span>'+esc(lob)+': '+pct(w/total)+'</span>');
    html += '</div>';
  }
  html += '</div>';

  // Nearest syndicates
  if(p.nearest_syndicates && p.nearest_syndicates.length){
    html += '<div class="card"><h3>Nearest Syndicates</h3>';
    const ns = p.nearest_syndicates;
    const nsHeaders = ['Syndicate','Year','Reserves (m)','HHI','Diversification','Distance','LoB Weights'];
    const nsRows = ns.map((r, ri)=>{
      // Build mini stacked bar for LoB weights
      let miniBar = '';
      if(r.lob_weights && typeof r.lob_weights === 'object'){
        const lwEntries = Object.entries(r.lob_weights);
        const lwTotal = lwEntries.reduce((s,[,v])=>s+v, 0);
        miniBar = '<div class="stacked-bar-h" style="height:18px;min-width:120px;">';
        lwEntries.forEach(([lob,w], i)=>{
          const pw = lwTotal > 0 ? (w/lwTotal*100) : 0;
          miniBar += '<div style="width:'+pw+'%;background:'+palette[i%palette.length]+'" title="'+esc(lob)+': '+pct(w/lwTotal)+'"></div>';
        });
        miniBar += '</div>';
      }
      return [
        esc(r.syndicate), esc(r.year), fmt(r.reserves_m, 1),
        fmt(r.hhi, 4), fmt(r.diversification, 4), fmt(r.distance, 4),
        miniBar
      ];
    });
    html += makeTable(nsHeaders, nsRows);
    html += '</div>';
  }

  // Histogram (b): Nearest syndicates PYD% distribution
  if(p.histogram_b){
    html += '<div class="card"><h3>Nearest Syndicates PYD% Distribution</h3><div class="chart-container"><canvas id="chart-persona-'+personaKey+'-histogram_b"></canvas></div></div>';
  }

  // Histogram (c): Market overlay (raw and standardised)
  if(p.histogram_c){
    html += '<div class="card"><h3>Market PYD% Overlay (Raw vs Standardised-to-Persona)</h3>';
    html += '<div class="info-msg" style="margin-bottom:8px;">Residual-based rescaling: each observation\'s PYD% residual (from market mean) is multiplied by sqrt(V<sub>target</sub>/V<sub>obs</sub>) from the combined dispersion model, then added back to the market mean. This scales dispersion to match the persona\'s size and HHI while preserving the market mean PYD%.</div>';
    html += '<div class="chart-container"><canvas id="chart-persona-'+personaKey+'-histogram_c"></canvas></div></div>';
  }

  // Market PYD% statistics table (raw vs standardised)
  if(p.market_pyd_stats && p.market_pyd_stats.raw && p.market_pyd_stats.standardised){
    const rs = p.market_pyd_stats.raw;
    const ss = p.market_pyd_stats.standardised;
    html += '<div class="card"><h3>Market PYD% Summary Statistics</h3>';
    html += makeTable(
      ['Metric', 'Raw', 'Standardised-to-Persona'],
      [
        ['Minimum',         fmt(rs.min,2)+'%',    fmt(ss.min,2)+'%'],
        ['Maximum',         fmt(rs.max,2)+'%',    fmt(ss.max,2)+'%'],
        ['Mean',            fmt(rs.mean,2)+'%',   fmt(ss.mean,2)+'%'],
        ['Median',          fmt(rs.median,2)+'%', fmt(ss.median,2)+'%'],
        ['Std Deviation',   fmt(rs.std,2)+'%',    fmt(ss.std,2)+'%'],
        ['75th Percentile', fmt(rs.p75,2)+'%',    fmt(ss.p75,2)+'%'],
        ['90th Percentile', fmt(rs.p90,2)+'%',    fmt(ss.p90,2)+'%'],
        ['99th Percentile', fmt(rs.p99,2)+'%',    fmt(ss.p99,2)+'%'],
        ['99.5th Percentile', fmt(rs.p995,2)+'%', fmt(ss.p995,2)+'%'],
        ['N',               rs.n||'',             ss.n||''],
      ]
    );
    html += '</div>';
  }

  // Rescaling multiplier diagnostics
  if(p.multiplier_stats && p.multiplier_stats.n){
    const ms = p.multiplier_stats;
    html += '<div class="card"><h3>Rescaling Multiplier Distribution</h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">Each observation\'s residual is multiplied by sqrt(V<sub>target</sub>/V<sub>obs</sub>). Multiplier &gt; 1 expands dispersion (target is riskier than observation), &lt; 1 compresses it.</p>';
    html += '<div class="chart-container"><canvas id="chart-persona-'+personaKey+'-multipliers"></canvas></div>';
    html += makeTable(['Statistic','Value'],[
      ['Mean multiplier', fmt(ms.mean,3)],
      ['Median multiplier', fmt(ms.median,3)],
      ['Std Deviation', fmt(ms.std,3)],
      ['Minimum', fmt(ms.min,3)],
      ['Maximum', fmt(ms.max,3)],
      ['10th Percentile', fmt(ms.p10,3)],
      ['90th Percentile', fmt(ms.p90,3)],
      ['N', ms.n||''],
    ]);
    html += '</div>';
  }

  // Tail diagnostics
  if(p.tail_diagnostics){
    const td = p.tail_diagnostics;
    html += '<div class="card"><h3>Tail Quality Diagnostics</h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">Measures whether the rescaled persona distribution has reliable tail estimates.</p>';
    const tdRows = [
      ['Kish effective sample size', td.kish_n_eff!=null?fmt(td.kish_n_eff,1):'--', 'Lower = more concentrated information; compare to N='+(p.multiplier_stats?p.multiplier_stats.n:'')],
      ['Raw excess kurtosis', td.raw_excess_kurtosis!=null?fmt(td.raw_excess_kurtosis,2):'--', 'Baseline tail heaviness (0 = normal)'],
      ['Rescaled excess kurtosis', td.rescaled_excess_kurtosis!=null?fmt(td.rescaled_excess_kurtosis,2):'--', 'After rescaling; large increase = inflated tails'],
    ];
    if(td.raw_excess_kurtosis!=null && td.rescaled_excess_kurtosis!=null){
      const kDelta = td.rescaled_excess_kurtosis - td.raw_excess_kurtosis;
      const meanMult = p.multiplier_stats ? p.multiplier_stats.mean : 1;
      let kInterp;
      if(meanMult < 1 && kDelta > 0){
        kInterp = '<span style="color:#ff7f0e;">Normalisation artefact (compression makes relative tails heavier, but absolute tails are shorter)</span>';
      } else if(kDelta > 2){
        kInterp = '<span style="color:#dc3545;">Substantial tail inflation</span>';
      } else if(kDelta > 0.5){
        kInterp = '<span style="color:#ff7f0e;">Moderate</span>';
      } else {
        kInterp = '<span style="color:#28a745;">Minimal</span>';
      }
      tdRows.push(['Kurtosis change', fmt(kDelta,2), kInterp]);
    }
    if(td.t_dist_df!=null){
      tdRows.push(['t-distribution df (fitted to raw)', fmt(td.t_dist_df,2), 'Lower df = heavier tails; df<5 = very heavy']);
    }
    tdRows.push(['Top 10% from nearest neighbours', td.nn_in_top10_pct+' / '+td.n_top10_pct+' ('+fmt(td.pct_top10_from_nn,1)+'%)', 'High = persona represents a genuinely tail-exposed profile']);
    tdRows.push(['Top 10% with multiplier > 1.5', td.manufactured_in_top10+' / '+td.n_top10_pct+' ('+fmt(td.pct_top10_manufactured,1)+'%)', 'High = tail is manufactured by rescaling, not observed']);
    html += makeTable(['Diagnostic','Value','Interpretation'], tdRows);
    html += '</div>';

    // Positive tail comparison histogram
    if(td.tail_histogram_raw && td.tail_histogram_rescaled){
      html += '<div class="card"><h3>Positive Tail Comparison (Top 10%)</h3>';
      html += '<p style="color:#6c757d;font-size:0.9rem;">Zooms in on the positive tail: raw market vs rescaled-to-persona. Shows how the rescaling changes the shape and extent of adverse PYD outcomes.</p>';
      html += '<div class="chart-container"><canvas id="chart-persona-'+personaKey+'-tail"></canvas></div></div>';
    }
  }

  // Capital metrics
  if(p.capital){
    html += '<div class="card"><h3>Capital Metrics</h3>';
    const cap = p.capital;
    html += makeTable(['Metric','Value'], Object.entries(cap).map(([k,v])=>[esc(k), esc(typeof v==='object'?JSON.stringify(v):v)]));
    html += '</div>';
  }

  el.innerHTML = html;

  // Draw histogram (b)
  if(p.histogram_b){
    const h = p.histogram_b;
    const bins = h.bins || h.labels || [];
    const counts = h.counts || h.values || [];
    if(bins.length >= 1){
      makeChart('chart-persona-'+personaKey+'-histogram_b',{
        type:'bar',
        data:{ labels:bins.map(b=>typeof b==='number'?b.toFixed(1)+'%':b), datasets:[{label:'Count',data:counts,backgroundColor:C('raw')}] },
        options:{ responsive:true, plugins:{legend:{display:false}, tooltip:{backgroundColor:'#333',cornerRadius:6}}, scales:{ y:{ beginAtZero:true, title:{display:true, text:'Count'} } } }
      });
    }
  }

  // Draw histogram (c) with overlay — align both series on a common bin grid
  if(p.histogram_c){
    const hc = p.histogram_c;
    if(hc.raw && hc.standardised){
      const rawBins = hc.raw.bins || [];
      const rawCounts = hc.raw.counts || [];
      const stdBins = hc.standardised.bins || [];
      const stdCounts = hc.standardised.counts || [];
      const bw = hc.raw.bin_width || hc.standardised.bin_width || 2;

      // Build common bin grid covering both ranges
      const allVals = rawBins.concat(stdBins).filter(b=>typeof b==='number');
      if(allVals.length < 2){ noData(document.getElementById('chart-persona-'+personaKey+'-histogram_c')?.parentElement); }
      else {
        const lo = Math.floor(Math.min(...allVals) / bw) * bw;
        const hi = Math.ceil(Math.max(...allVals) / bw) * bw;
        const commonBins = [];
        for(let b = lo; b <= hi; b += bw) commonBins.push(Math.round(b*10)/10);

        // Map each series onto the common grid
        function mapToGrid(bins, counts, grid, bw){
          const out = new Array(grid.length).fill(0);
          for(let i = 0; i < bins.length && i < counts.length; i++){
            // Find the closest grid bin
            let bestIdx = 0, bestDist = Infinity;
            for(let j = 0; j < grid.length; j++){
              const d = Math.abs(grid[j] - bins[i]);
              if(d < bestDist){ bestDist = d; bestIdx = j; }
            }
            if(bestDist < bw) out[bestIdx] += counts[i];
          }
          return out;
        }
        const rawAligned = mapToGrid(rawBins, rawCounts, commonBins, bw);
        const stdAligned = mapToGrid(stdBins, stdCounts, commonBins, bw);
        const labels = commonBins.map(b => b.toFixed(1)+'%');

        makeChart('chart-persona-'+personaKey+'-histogram_c',{
          type:'bar',
          data:{
            labels,
            datasets:[
              {label:'Raw Market', data:rawAligned, backgroundColor:'rgba(33,102,172,0.5)', borderColor:C('raw'), borderWidth:1},
              {label:'Standardised to Persona', data:stdAligned, backgroundColor:'rgba(178,24,43,0.5)', borderColor:C('standardised'), borderWidth:1}
            ]
          },
          options:{ responsive:true, plugins:{legend:{position:'bottom'}, tooltip:{backgroundColor:'#333',cornerRadius:6}}, scales:{ y:{ beginAtZero:true, title:{display:true, text:'Count'} } } }
        });
      }
    } else {
      // Fallback: single histogram
      const bins = hc.bins || hc.labels || [];
      const counts = hc.counts || hc.values || [];
      if(bins.length >= 1){
        makeChart('chart-persona-'+personaKey+'-histogram_c',{
          type:'bar',
          data:{ labels:bins.map(b=>typeof b==='number'?b.toFixed(1)+'%':b), datasets:[{label:'Count',data:counts,backgroundColor:C('raw')}] },
          options:{ responsive:true, plugins:{legend:{display:false}, tooltip:{backgroundColor:'#333',cornerRadius:6}} }
        });
      }
    }
  }

  // Draw multiplier histogram
  if(p.histogram_multipliers && p.histogram_multipliers.bins && p.histogram_multipliers.bins.length){
    const mh = p.histogram_multipliers;
    makeChart('chart-persona-'+personaKey+'-multipliers',{
      type:'bar',
      data:{ labels:mh.bins.map(b=>fmt(b,2)), datasets:[{label:'Count',data:mh.counts,backgroundColor:'#ff7f0e'}] },
      options:{ responsive:true, plugins:{legend:{display:false}},
        scales:{ x:{ title:{display:true, text:'Rescaling Multiplier'} }, y:{ beginAtZero:true, title:{display:true, text:'Count'} } }
      }
    });
  }

  // Draw positive tail comparison histogram
  if(p.tail_diagnostics && p.tail_diagnostics.tail_histogram_raw && p.tail_diagnostics.tail_histogram_rescaled){
    const thr = p.tail_diagnostics.tail_histogram_raw;
    const ths = p.tail_diagnostics.tail_histogram_rescaled;
    // Merge bin labels from both
    const allBins = new Set([...thr.bins.map(b=>fmt(b,1)), ...ths.bins.map(b=>fmt(b,1))]);
    const sortedBins = [...allBins].sort((a,b)=>parseFloat(a)-parseFloat(b));
    const rawMap = {}; thr.bins.forEach((b,i)=> rawMap[fmt(b,1)] = thr.counts[i]);
    const stdMap = {}; ths.bins.forEach((b,i)=> stdMap[fmt(b,1)] = ths.counts[i]);
    makeChart('chart-persona-'+personaKey+'-tail',{
      type:'bar',
      data:{
        labels:sortedBins.map(b=>b+'%'),
        datasets:[
          { label:'Raw Market', data:sortedBins.map(b=>rawMap[b]||0), backgroundColor:'rgba(33,102,172,0.5)', borderColor:C('raw'), borderWidth:1 },
          { label:'Rescaled to Persona', data:sortedBins.map(b=>stdMap[b]||0), backgroundColor:'rgba(177,24,45,0.5)', borderColor:C('standardised'), borderWidth:1 }
        ]
      },
      options:{ responsive:true,
        plugins:{ legend:{display:true} },

function weUpdateSliders(){

function weCompute(){
  const we = DATA.worked_example;
  if(!we || !we.lob_coefficients) return;
  const lobs = we.lob_names || Object.keys(we.lob_coefficients);
  const coeffs = we.lob_coefficients;
  const n = lobs.length;
  const refSize = we.reference_size_m || 500;
  const reserveSize = parseFloat(document.getElementById('we-reserve-size')?.value || refSize);

  // Get query weights from sliders
  let rawWeights = [];
  let total = 0;
  for(let i=0;i<n;i++){
    const s = document.getElementById('we-slider-'+i);
    const v = s? parseInt(s.value) : 1;
    rawWeights.push(v); total += v;
  }
  const weights = rawWeights.map(w=> total>0? w/total : 0);

  // Get selected syndicates' LoB severity vectors
  function getSynData(ab){
    const sel = document.getElementById('we-syn-'+ab);
    if(!sel) return null;
    const val = sel.value;
    if(val === '__a' && we.syndicate_a) return we.syndicate_a;
    if(val === '__b' && we.syndicate_b) return we.syndicate_b;
    if(val && DATA.observations) return DATA.observations[parseInt(val)];
    return null;
  }
  const synA = getSynData('a');
  const synB = getSynData('b');

  let html = '';

  // Step 1: Display LoB severity vectors
  html += '<div class="step-box"><h4>Step 1: LoB Severity Vectors</h4>';
  html += '<table style="font-size:12px;"><tr><th>LoB</th><th>Query w<sub>q</sub></th>';
  if(synA) html += '<th>Syn '+esc(synA.syndicate)+' s<sub>l</sub></th>';
  if(synB) html += '<th>Syn '+esc(synB.syndicate)+' s<sub>l</sub></th>';
  html += '</tr>';
  const sLobA = synA? (synA.s_lob || synA.lob_severity || []) : [];
  const sLobB = synB? (synB.s_lob || synB.lob_severity || []) : [];
  lobs.forEach((lob,i)=>{
    html += '<tr><td>'+esc(lob)+'</td><td>'+fmt(weights[i],3)+'</td>';
    if(synA) html += '<td>'+fmt(sLobA[i],4)+'</td>';
    if(synB) html += '<td>'+fmt(sLobB[i],4)+'</td>';
    html += '</tr>';
  });
  html += '</table></div>';

  // Step 2: Mix-standardised severity = w_q · s_lob
  function dotProd(w, s){ let sum=0; for(let i=0;i<w.length&&i<s.length;i++) sum+=w[i]*(s[i]||0); return sum; }
  const sStdA = sLobA.length? dotProd(weights, sLobA) : null;
  const sStdB = sLobB.length? dotProd(weights, sLobB) : null;

  html += '<div class="step-box"><h4>Step 2: Mix-Standardised Severity (w<sub>q</sub> &middot; s)</h4>';
  html += '<p>Dot product of query portfolio weights and LoB severity vector.</p>';
  if(synA) html += '<p>Syndicate '+esc(synA.syndicate)+': S<sub>std</sub> = <span class="mono">'+fmt(sStdA,4)+'</span></p>';
  if(synB) html += '<p>Syndicate '+esc(synB.syndicate)+': S<sub>std</sub> = <span class="mono">'+fmt(sStdB,4)+'</span></p>';
  if(!synA && !synB) html += '<p class="text-muted">Select syndicates above to see values.</p>';
  html += '</div>';

  // Step 3: Weighted beta = Σ w_q_l × β_l
  let betaW = 0;
  html += '<div class="step-box"><h4>Step 3: Composite Size Exponent (&beta;<sub>w</sub> = &Sigma; w<sub>q</sub> &middot; &beta;<sub>l</sub>)</h4>';
  html += '<table style="font-size:12px;"><tr><th>LoB</th><th>&beta;<sub>l</sub></th><th>w<sub>q</sub></th><th>Contribution</th></tr>';
  lobs.forEach((lob,i)=>{
    const bl = coeffs[lob] || 0;
    const contrib = bl * weights[i];
    betaW += contrib;
    html += '<tr><td>'+esc(lob)+'</td><td>'+fmt(bl,3)+'</td><td>'+fmt(weights[i],3)+'</td><td>'+fmt(contrib,4)+'</td></tr>';
  });
  html += '<tr style="font-weight:bold;"><td>Total</td><td></td><td></td><td>'+fmt(betaW,4)+'</td></tr>';
  html += '</table>';
  html += '<div class="result">&beta;<sub>w</sub> = '+fmt(betaW,4)+'</div></div>';

  // Step 4: Size adjustment
  const sizeAdj = (reserveSize > 0 && refSize > 0) ? Math.pow(reserveSize / refSize, betaW) : 1.0;
  html += '<div class="step-box"><h4>Step 4: Size Adjustment</h4>';
  html += '<p>A = (R<sub>q</sub> / R<sub>ref</sub>)<sup>&beta;<sub>w</sub></sup> = ('+fmt(reserveSize,0)+' / '+fmt(refSize,0)+')<sup>'+fmt(betaW,4)+'</sup></p>';
  html += '<div class="result">A = '+fmt(sizeAdj,4)+'</div>';
  if(synA && sStdA !== null){
    const adjA = sStdA * sizeAdj;
    html += '<p>Syn '+esc(synA.syndicate)+': S<sub>adj</sub> = S<sub>std</sub> &times; A = '+fmt(sStdA,4)+' &times; '+fmt(sizeAdj,4)+' = <strong>'+fmt(adjA,4)+'</strong></p>';
  }
  if(synB && sStdB !== null){
    const adjB = sStdB * sizeAdj;
    html += '<p>Syn '+esc(synB.syndicate)+': S<sub>adj</sub> = S<sub>std</sub> &times; A = '+fmt(sStdB,4)+' &times; '+fmt(sizeAdj,4)+' = <strong>'+fmt(adjB,4)+'</strong></p>';
  }
  html += '<p class="text-muted" style="margin-top:8px;font-size:12px;">Note: Event fixed effects are set to zero in this worked example.</p>';
  html += '</div>';

  document.getElementById('we-steps').innerHTML = html;
}

    }
    if(td.mean_excess && td.mean_excess.standardised && td.mean_excess.standardised.thresholds){
      stdPts = td.mean_excess.standardised.thresholds.map((t,i)=>({x:t,y:td.mean_excess.standardised.values[i]}));
    } else if(Array.isArray(td.standardised)){
      stdPts = td.standardised.map(p=>({x:p.threshold||p.x, y:p.mean_excess||p.y}));
    } else if(td.mix_standardised && Array.isArray(td.mix_standardised)){
      stdPts = td.mix_standardised.map(p=>({x:p.threshold||p.x, y:p.mean_excess||p.y}));
    } else if(td.mix_standardised && td.mix_standardised.mean_excess_function){
      stdPts = td.mix_standardised.mean_excess_function.map(p=>({x:p.threshold||p.x, y:p.mean_excess||p.y}));
    }
    const meDsets = [];
    if(rawPts.length) meDsets.push({label:'Raw', data:rawPts, borderColor:C('raw'), backgroundColor:C('raw'), showLine:true, pointRadius:3, tension:0.1});
    if(stdPts.length) meDsets.push({label:'Standardised', data:stdPts, borderColor:C('standardised'), backgroundColor:C('standardised'), showLine:true, pointRadius:3, tension:0.1});
    if(meDsets.length){
      makeChart('chart-pp-mean-excess',{
        type:'scatter', data:{datasets:meDsets},
        options:{ responsive:true, plugins:{tooltip:{backgroundColor:'#333',cornerRadius:6}, legend:{position:'bottom'}},
          scales:{ x:{title:{display:true,text:'Threshold'}}, y:{title:{display:true,text:'Mean Excess'}} }
        }
      });
    }
  }

  // Chart: Size vs PYD Severity scatter
  if(ss && ss.scatter_data){
    const pts = ss.scatter_data.points || ss.scatter_data || [];
    if(pts.length>=2){
      const scData = pts.map(p=>({x:p.x, y:p.y}));
      const dsets = [{label:'Observations', data:scData, backgroundColor:'rgba(108,117,125,0.3)', borderColor:'transparent', pointRadius:3}];
      const pe = ss.scatter_data.regression_line || ss.primary || ss.primary_estimator || ss.re_gls || {};
      if(pe.intercept!=null && (pe.slope!=null||pe.beta!=null)){
        const slope = pe.slope||pe.beta;
        const xs = scData.map(d=>d.x).sort((a,b)=>a-b);
        dsets.push({label:'RE-GLS', data:[{x:xs[0],y:pe.intercept+slope*xs[0]},{x:xs[xs.length-1],y:pe.intercept+slope*xs[xs.length-1]}],
          type:'scatter', showLine:true, borderColor:C('standardised'), backgroundColor:'transparent', pointRadius:0, borderWidth:2});
      }
      makeChart('chart-pp-size-scatter',{
        type:'scatter', data:{datasets:dsets},
        options:{ responsive:true, plugins:{tooltip:{backgroundColor:'#333',cornerRadius:6}, legend:{position:'bottom'}},
          scales:{ x:{title:{display:true,text:'Log(Reserve Size)'}}, y:{title:{display:true,text:'PYD Severity'}} }
        }
      });
    }
  }

  // Chart: VaR Decomposition grouped bar
  if(portfolios.length){
    const names = portfolios.map(p=>p.name);
    makeChart('chart-pp-var-decomp',{
      type:'bar',
      data:{
        labels:names,
        datasets:[
          {label:'Naive VaR 99.5%', data:portfolios.map(p=>p.naive?.var_995??0), backgroundColor:C('raw')},
          {label:'Mix-Adj VaR 99.5%', data:portfolios.map(p=>p.mix_only?.var_995??0), backgroundColor:C('standardised')},
          {label:'Full-Adj VaR 99.5%', data:portfolios.map(p=>p.full?.var_995??0), backgroundColor:C('favourable')}
        ]
      },
      options:{ responsive:true, plugins:{legend:{position:'bottom'}, tooltip:{backgroundColor:'#333',cornerRadius:6}},
        scales:{ y:{title:{display:true,text:'VaR 99.5%'}} }
      }
    });
  }

  // Chart: PYD Distribution Histogram
  if(dist && dist.pyd_histogram){
    const h = dist.pyd_histogram;
    const bins = h.bins || [];
    const counts = h.counts || [];
    if(bins.length>=2){
      const labels = bins.map(b=> typeof b==='string'? b : (b+'%'));
      const bgColors = bins.map(b=>{
        const val = typeof b==='number'? b : parseFloat(b);
        return val >= 0 ? C('adverse') : C('favourable');
      });
      makeChart('chart-pp-pyd-hist',{
        type:'bar',
        data:{labels, datasets:[{label:'Count',data:counts,backgroundColor:bgColors}]},
        options:{ indexAxis:'y', responsive:true, plugins:{legend:{display:false}, tooltip:{backgroundColor:'#333',cornerRadius:6}},
          scales:{ x:{beginAtZero:true,title:{display:true,text:'Count'}} }
        }
      });
    }
  }

  // Chart: Boxplots by reserves decile
  if(dist && dist.boxplots && dist.boxplots.by_reserves_decile && dist.boxplots.by_reserves_decile.length){
    const bp = dist.boxplots.by_reserves_decile;
    const labels = bp.map(b=> b.label||b.decile||'');
    const mins = bp.map(b=> b.min||b.whisker_low||b.q0);
    const q1s = bp.map(b=> b.q1||b.q25);
    const medians = bp.map(b=> b.median||b.q50);
    const q3s = bp.map(b=> b.q3||b.q75);
    const maxs = bp.map(b=> b.max||b.whisker_high||b.q100);
    makeChart('chart-pp-bp-reserves',{
      type:'bar',
      data:{
        labels,
        datasets:[
          {label:'Whisker Low-Q1', data:bp.map((b,i)=>[mins[i],q1s[i]]), backgroundColor:'rgba(33,102,172,0.15)', borderColor:'transparent'},
          {label:'Q1-Median', data:bp.map((b,i)=>[q1s[i],medians[i]]), backgroundColor:C('raw'), borderColor:C('raw')},
          {label:'Median-Q3', data:bp.map((b,i)=>[medians[i],q3s[i]]), backgroundColor:C('raw'), borderColor:C('raw')},
          {label:'Q3-Whisker High', data:bp.map((b,i)=>[q3s[i],maxs[i]]), backgroundColor:'rgba(33,102,172,0.15)', borderColor:'transparent'}
        ]
      },
      options:{ responsive:true, plugins:{legend:{display:false},
          tooltip:{callbacks:{label:function(ctx){
            const i=ctx.dataIndex;
            return 'Min:'+fmt(mins[i])+' Q1:'+fmt(q1s[i])+' Med:'+fmt(medians[i])+' Q3:'+fmt(q3s[i])+' Max:'+fmt(maxs[i]);
          }},backgroundColor:'#333',cornerRadius:6}
        },
        scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true,text:'PYD %'}} }
      }
    });
  }

  // Chart: HHI vs Severity scatter
  if(ec && ec.hhi_scatter && ec.hhi_scatter.points && ec.hhi_scatter.points.length>1){
    const pts = ec.hhi_scatter.points;
    const scData = pts.map(p=>({x:p.x, y:p.y}));
    const hhiDsets = [{label:'Observations', data:scData, backgroundColor:'rgba(108,117,125,0.3)', borderColor:'transparent', pointRadius:3}];
    const dir = ec.hhi_scatter.direction || {};
    if(dir.intercept!=null && dir.beta!=null){
      const xs = scData.map(d=>d.x).sort((a,b)=>a-b);
      hhiDsets.push({label:'Mean (OLS)', data:[{x:xs[0],y:dir.intercept+dir.beta*xs[0]},{x:xs[xs.length-1],y:dir.intercept+dir.beta*xs[xs.length-1]}],
        type:'scatter', showLine:true, borderColor:C('standardised'), backgroundColor:'transparent', pointRadius:0, borderWidth:2});
    }
    makeChart('chart-pp-hhi-scatter',{
      type:'scatter', data:{datasets:hhiDsets},
      options:{ responsive:true, plugins:{tooltip:{backgroundColor:'#333',cornerRadius:6}, legend:{position:'bottom'}},
        scales:{ x:{title:{display:true,text:'Diversification (1 - HHI)'}}, y:{title:{display:true,text:'PYD Severity'}} }
      }
    });
  }

  // Chart: Diversification vs Reserves scatter
  if(jc && jc.hhi_r_correlation && jc.hhi_r_correlation.scatter_points && jc.hhi_r_correlation.scatter_points.length>1){
    const corrData = jc.hhi_r_correlation.scatter_points.map(p=>({x:p.x, y:p.y}));
    makeChart('chart-pp-hhi-r-scatter',{
      type:'scatter',
      data:{datasets:[{label:'Observations', data:corrData, backgroundColor:'rgba(108,117,125,0.3)', borderColor:'transparent', pointRadius:3}]},
      options:{ responsive:true, plugins:{tooltip:{backgroundColor:'#333',cornerRadius:6}},
        scales:{ x:{title:{display:true,text:'Diversification (1 - HHI)'}}, y:{title:{display:true,text:'Opening Reserves (m)'}} }
      }
    });
  }
}
</script>
</body>
</html>
