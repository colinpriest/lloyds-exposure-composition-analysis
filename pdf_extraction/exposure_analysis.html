<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exposure Composition Analysis Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --raw: #2166ac;
  --standardised: #b2182b;
  --favourable: #27ae60;
  --adverse: #e74c3c;
  --size-credit: #4daf4a;
  --size-penalty: #ff7f0e;
  --mix-effect: #ffd700;
  --neutral: #6c757d;
  --bg: #f8f9fa;
  --card-bg: #ffffff;
  --border: #dee2e6;
  --text: #212529;
  --text-muted: #6c757d;
  --tab-active: #2166ac;
  --tab-hover: #e9ecef;
}
.cb-mode {
  --raw: #0072B2;
  --standardised: #D55E00;
  --favourable: #009E73;
  --adverse: #CC79A7;
  --size-credit: #009E73;
  --size-penalty: #E69F00;
  --mix-effect: #F0E442;
  --neutral: #999999;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
header { background: #2c3e50; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 20px; font-weight: 600; }
.header-controls { display: flex; gap: 12px; align-items: center; }
.header-controls label { font-size: 13px; cursor: pointer; }
.header-controls input[type="checkbox"] { margin-right: 4px; }
.provenance { background: #eaf2f8; border-left: 4px solid var(--raw); padding: 12px 16px; margin-bottom: 16px; font-size: 13px; border-radius: 4px; }
.provenance span { margin-right: 20px; }
.provenance strong { font-weight: 600; }
.tab-bar { display: flex; flex-wrap: wrap; border-bottom: 2px solid var(--border); margin-bottom: 20px; gap: 2px; }
.tab-btn { padding: 8px 14px; border: none; background: none; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); border-bottom: 3px solid transparent; transition: all 0.15s; white-space: nowrap; }
.tab-btn:hover { background: var(--tab-hover); }
.tab-btn.active { color: var(--tab-active); border-bottom-color: var(--tab-active); font-weight: 600; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.card h3 { font-size: 16px; margin-bottom: 12px; color: #2c3e50; }
.card h4 { font-size: 14px; margin-bottom: 8px; color: #34495e; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: #f1f3f5; font-weight: 600; position: sticky; top: 0; }
tr:nth-child(even) { background: #f8f9fa; }
tr:hover { background: #e9ecef; }
.chart-container { position: relative; max-height: 500px; margin: 12px 0; }
canvas { max-height: 500px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; color: var(--raw); }
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-stable { background: #d4edda; color: #155724; }
.badge-moderate { background: #fff3cd; color: #856404; }
.badge-unstable { background: #f8d7da; color: #721c24; }
.btn { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
.btn-primary { background: var(--raw); color: white; }
.btn-primary:hover { background: #1a5490; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--tab-hover); }
.drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 40px; text-align: center; color: var(--text-muted); transition: all 0.2s; cursor: pointer; }
.drop-zone.dragover { border-color: var(--raw); background: #eaf2f8; }
.landing { text-align: center; padding: 60px 20px; }
.landing h2 { font-size: 24px; margin-bottom: 16px; color: #2c3e50; }
.landing p { margin-bottom: 20px; color: var(--text-muted); }
.error-msg { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
.info-msg { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
.no-data { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }
.tooltip-custom { position: absolute; background: #333; color: white; font-size: 12px; padding: 8px 12px; border-radius: 6px; pointer-events: none; z-index: 1000; max-width: 300px; }
.selected-obs { background: #fff8e1; border: 1px solid #ffd700; border-radius: 8px; padding: 16px; margin-top: 12px; }
.selected-obs h4 { margin-bottom: 8px; }
.slider-group { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.slider-group label { min-width: 120px; font-size: 13px; }
.slider-group input[type="range"] { flex: 1; }
.slider-group .slider-val { min-width: 50px; text-align: right; font-size: 13px; font-weight: 600; }
.stacked-bar-h { height: 28px; display: flex; border-radius: 4px; overflow: hidden; margin: 4px 0; }
.stacked-bar-h div { display: flex; align-items: center; justify-content: center; font-size: 11px; color: white; font-weight: 600; min-width: 2px; }
.collapsible-header { cursor: pointer; user-select: none; padding: 8px 12px; background: #f1f3f5; border-radius: 4px; margin-bottom: 4px; font-weight: 600; font-size: 13px; }
.collapsible-header::before { content: '\25B6'; margin-right: 8px; font-size: 10px; display: inline-block; transition: transform 0.2s; }
.collapsible-header.open::before { transform: rotate(90deg); }
.collapsible-body { display: none; padding: 8px 0; }
.collapsible-body.open { display: block; }
.dot-plot-row { display: flex; align-items: center; margin: 4px 0; font-size: 12px; }
.dot-plot-row .dp-label { min-width: 100px; text-align: right; padding-right: 8px; }
.dot-plot-row .dp-bar { flex: 1; height: 20px; position: relative; background: #f1f3f5; border-radius: 3px; }
.step-box { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.step-box h4 { color: var(--raw); margin-bottom: 8px; }
.step-box .result { font-size: 20px; font-weight: 700; color: var(--standardised); margin-top: 8px; }
input[type="file"] { display: none; }
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .tab-btn { padding: 6px 10px; font-size: 12px; }
}
</style>
</head>
<body>

<header>
  <h1>Exposure Composition Analysis</h1>
  <div class="header-controls">
    <label><input type="checkbox" id="cbToggle" onchange="toggleCB()"> Colour-blind mode</label>
  </div>
</header>

<div class="container">
  <div id="provenanceBar" class="provenance" style="display:none;"></div>
  <div id="errorArea"></div>

  <div id="landingPage" class="landing">
    <h2>Exposure Composition Analysis Dashboard</h2>
    <p>Load an <code>exposure_results.json</code> file to begin.</p>
    <div style="margin-bottom:20px;">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Load Results</button>
      <input type="file" id="fileInput" accept=".json" onchange="handleFile(event)">
    </div>
    <div id="dropZone" class="drop-zone">
      <p>Or drag &amp; drop your <code>exposure_results.json</code> file here</p>
    </div>
  </div>

  <div id="dashboardArea" style="display:none;">
    <div class="tab-bar" id="tabBar"></div>
    <div id="tabContents"></div>
  </div>
</div>

<script>
// ============================================================
// GLOBALS
// ============================================================
let DATA = null;
let charts = {};
let selectedObs = {};
const TAB_NAMES = [
  'Data Summary','Distribution','Tail Trends','Tail Diagnostics',
  'Size Scaling','Exposure Composition','Joint Composition','Capital Impact','Robustness',
  'Persona: Typical','Persona: Small','Persona: Large','Persona: Diversified','Persona: Undiversified',
  'Worked Example','Data Quality','Paper Pack'
];

const COLORS = {
  raw:'#2166ac', standardised:'#b2182b', favourable:'#27ae60', adverse:'#e74c3c',
  sizeCredit:'#4daf4a', sizePenalty:'#ff7f0e', mix:'#ffd700', neutral:'#6c757d'
};
const CB_COLORS = {
  raw:'#0072B2', standardised:'#D55E00', favourable:'#009E73', adverse:'#CC79A7',
  sizeCredit:'#009E73', sizePenalty:'#E69F00', mix:'#F0E442', neutral:'#999999'
};
let activeColors = COLORS;

function C(k){ return activeColors[k] || '#888'; }

function toggleCB(){
  const cb = document.getElementById('cbToggle').checked;
  document.body.classList.toggle('cb-mode', cb);
  activeColors = cb ? CB_COLORS : COLORS;
  rebuildAllTabs();
}

// ============================================================
// FILE LOADING
// ============================================================
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e=>{
  e.preventDefault(); dropZone.classList.remove('dragover');
  if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

function handleFile(e){ if(e.target.files.length) loadFile(e.target.files[0]); }

function loadFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const json = JSON.parse(e.target.result);
      validateAndLoad(json);
    } catch(err){
      showError('Invalid JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function showError(msg){
  document.getElementById('errorArea').innerHTML = '<div class="error-msg">'+esc(msg)+'</div>';
}
function clearError(){ document.getElementById('errorArea').innerHTML = ''; }

function validateAndLoad(json){
  clearError();
  if(json.spec_version !== '2.0' && json.spec_version !== 2.0){
    showError('Spec version mismatch: expected "2.0", got "'+json.spec_version+'"');
    return;
  }
  const required = ['meta','distribution','tail_trends','tail_diagnostics','size_scaling',
    'capital_impact','robustness','personas','worked_example','data_quality','analysis_config'];
  const missing = required.filter(k=> !(k in json));
  if(missing.length){
    showError('Missing required keys: ' + missing.join(', '));
    return;
  }
  DATA = json;
  showDashboard();
}

// ============================================================
// DASHBOARD INIT
// ============================================================
function showDashboard(){
  document.getElementById('landingPage').style.display = 'none';
  document.getElementById('dashboardArea').style.display = 'block';
  showProvenance();
  buildTabs();
  rebuildAllTabs();
  switchTab(0);
}

function showProvenance(){
  const bar = document.getElementById('provenanceBar');
  const m = DATA.meta || {};
  bar.style.display = 'block';
  let html = '';
  if(m.analysis_run_id) html += '<span><strong>Run ID:</strong> '+esc(m.analysis_run_id)+'</span>';
  if(m.timestamp) html += '<span><strong>Timestamp:</strong> '+esc(m.timestamp)+'</span>';
  if(m.source_data_hash) html += '<span><strong>Data Hash:</strong> '+esc(m.source_data_hash)+'</span>';
  if(DATA.subsets){
    const sk = Object.keys(DATA.subsets);
    html += '<span><strong>Subsets:</strong> '+sk.map(k=>esc(k)+' ('+DATA.subsets[k].n+')').join(', ')+'</span>';
  }
  bar.innerHTML = html;
}

function buildTabs(){
  const bar = document.getElementById('tabBar');
  const cont = document.getElementById('tabContents');
  bar.innerHTML = '';
  cont.innerHTML = '';
  TAB_NAMES.forEach((name, i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = name;
    btn.onclick = ()=> switchTab(i);
    btn.id = 'tab-btn-'+i;
    bar.appendChild(btn);
    const div = document.createElement('div');
    div.className = 'tab-content';
    div.id = 'tab-content-'+i;
    cont.appendChild(div);
  });
}

function switchTab(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=> b.classList.toggle('active', i===idx));
  document.querySelectorAll('.tab-content').forEach((d,i)=> d.classList.toggle('active', i===idx));
}

function rebuildAllTabs(){
  destroyAllCharts();
  renderTab0(); renderTab1(); renderTab2(); renderTab3();
  renderTab4(); renderTabExposure(); renderTabJoint(); renderTab7(); renderTab8();
  renderTabPersona('typical',9); renderTabPersona('small',10); renderTabPersona('large',11); renderTabPersona('diversified',12); renderTabPersona('undiversified',13);
  renderTab14(); renderTab15();
  renderTabPaperPack();
}

function destroyAllCharts(){
  Object.values(charts).forEach(c=>{ try{c.destroy();}catch(e){} });
  charts = {};
}

// ============================================================
// UTILITIES
// ============================================================
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(v, d=2){ if(v==null) return 'N/A'; return typeof v==='number'? v.toFixed(d) : String(v); }
function ci95(val, se, floor=null, d=6){
  if(val==null || se==null) return '';
  let lo = val - 1.96*se, hi = val + 1.96*se;
  if(floor!=null){ lo = Math.max(floor, lo); hi = Math.max(floor, hi); }
  return ' <span style="color:#6c757d;">['+fmt(lo,d)+', '+fmt(hi,d)+']</span>';
}
function fmtC(m, useDisplay){
  // Format C parameter with profile CI and constraint note
  // useDisplay=true for HHI models (show negated C in diversification convention)
  const cVal = (useDisplay && m.display_C!=null) ? m.display_C : m.C;
  const cCI = (useDisplay && m.display_c_ci_95) ? m.display_c_ci_95 : m.c_ci_95;
  const cNote = (useDisplay && m.display_c_ci_note) ? m.display_c_ci_note : m.c_ci_note;
  let s = fmt(cVal,3);
  if(cCI && cCI[0]!=null && cCI[1]!=null){
    s += ' <span style="color:#6c757d;">['+fmt(cCI[0],3)+', '+fmt(cCI[1],3)+']</span>';
  }
  if(cNote){ s += ' <span style="color:#ff7f0e;font-size:0.85em;">'+esc(cNote)+'</span>'; }
  return s;
}
function pct(v, d=1){ if(v==null) return 'N/A'; return (v*100).toFixed(d)+'%'; }
function noData(el, msg){ el.innerHTML = '<div class="no-data">'+(msg||'No data available')+'</div>'; }
function insufficientData(el){ el.innerHTML = '<div class="no-data">Insufficient data (fewer than 2 data points)</div>'; }

function makeTable(headers, rows, opts={}){
  let html = '<div style="overflow-x:auto;"><table><thead><tr>';
  headers.forEach(h=> html += '<th>'+esc(h)+'</th>');
  html += '</tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr>';
    r.forEach((c,i)=> html += '<td>'+c+'</td>');
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function stabilityBadge(s){
  if(!s) return '';
  const sl = String(s).toLowerCase();
  if(sl==='stable') return '<span class="badge badge-stable">Stable</span>';
  if(sl==='moderate') return '<span class="badge badge-moderate">Moderate</span>';
  return '<span class="badge badge-unstable">'+esc(s)+'</span>';
}

// Custom sqrt scale for Chart.js — compresses outliers without log(0) issues
class SqrtScale extends Chart.Scale {
  constructor(cfg){ super(cfg); this._startValue = 0; this._endValue = 1; }
  parse(raw){ return typeof raw==='number'? raw : NaN; }
  determineDataLimits(){ const {min,max} = this.getMinMax(true); this.min = Math.max(min||0, 0); this.max = max||1; }
  buildTicks(){
    const sqMax = Math.sqrt(this.max);
    const n = 8;
    this.ticks = [];
    for(let i=0; i<=n; i++){
      const v = Math.pow(sqMax*i/n, 2);
      this.ticks.push({value:v});
    }
    return this.ticks;
  }
  getPixelForValue(val){ const range = this._endValue - this._startValue; if(range===0) return this.top; const pct = (Math.sqrt(Math.max(val,0)) - this._startValue) / range; return this.top + (1-pct) * (this.bottom - this.top); }
  getValueForPixel(px){ const pct = 1 - (px - this.top) / (this.bottom - this.top); const sq = this._startValue + pct * (this._endValue - this._startValue); return sq*sq; }
  configure(){ super.configure(); this._startValue = Math.sqrt(this.min); this._endValue = Math.sqrt(this.max); }
}
SqrtScale.id = 'sqrt';
SqrtScale.defaults = { ticks:{ callback: function(v){ return v<0.001? '0' : v<0.01? fmt(v,4) : fmt(v,3); } } };
Chart.register(SqrtScale);

function makeChart(canvasId, config){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return null;
  const ctx = canvas.getContext('2d');
  const c = new Chart(ctx, config);
  charts[canvasId] = c;
  return c;
}

function selectedObsCard(id){
  return '<div id="sel-'+id+'" class="selected-obs" style="display:none;"><h4>Selected Observation</h4><div id="sel-detail-'+id+'"></div><button class="btn btn-sm btn-outline" onclick="clearSelection(\''+id+'\')">Clear</button></div>';
}
function clearSelection(id){
  const el = document.getElementById('sel-'+id);
  if(el) el.style.display='none';
  delete selectedObs[id];
}
function showSelection(id, html){
  const el = document.getElementById('sel-'+id);
  const det = document.getElementById('sel-detail-'+id);
  if(el && det){ det.innerHTML = html; el.style.display='block'; }
}

// ============================================================
// TAB 0: Data Summary
// ============================================================
function renderTab0(){
  const el = document.getElementById('tab-content-0');
  if(!DATA){ noData(el); return; }
  const m = DATA.meta || {};
  const sub = DATA.subsets || {};
  const elig = DATA.eligibility || {};
  const cfg = DATA.analysis_config || {};

  let html = '<div class="card"><h3>Corpus Summary</h3>';
  const rows = [];
  if(m.years_covered) rows.push(['Years Covered', esc(Array.isArray(m.years_covered)?m.years_covered.join(', '):m.years_covered)]);
  if(m.total_observations!=null) rows.push(['Total Observations', esc(m.total_observations)]);
  if(m.unique_syndicates!=null) rows.push(['Unique Syndicates', esc(m.unique_syndicates)]);
  if(sub.DENSE){
    const spy = sub.DENSE.syndicates_per_year;
    rows.push(['DENSE Subset — Syndicates/Year', spy && typeof spy==='object'? spy.min+' / '+spy.median+' / '+spy.max : esc(spy||sub.DENSE.n)]);
  }
  if(sub.MID){
    const spy = sub.MID.syndicates_per_year;
    rows.push(['MID Subset — Syndicates/Year', spy && typeof spy==='object'? spy.min+' / '+spy.median+' / '+spy.max : esc(spy||sub.MID.n)]);
  }
  if(m.balanced_panel_k8!=null) rows.push(['Balanced Panel K&ge;8', esc(m.balanced_panel_k8)]);
  if(m.median_reserves!=null) rows.push(['Median Reserves', esc(m.median_reserves)]);
  if(m.lob_categories!=null) rows.push(['LoB Categories', esc(Array.isArray(m.lob_categories)?m.lob_categories.join(', '):m.lob_categories)]);
  if(m.obs_2024!=null) rows.push(['2024 Observations', esc(m.obs_2024)]);
  html += makeTable(['Metric','Value'], rows);
  html += '</div>';

  // Data quality stacked bar
  if(m.discarded || m.kept){
    html += '<div class="card"><h3>Data Quality Breakdown</h3>';
    const disc = m.discarded || {};
    const kept = m.kept || {};
    const total = (disc.count||0) + (kept.count||0);
    if(total > 0){
      const dp = ((disc.count||0)/total*100);
      const kp = ((kept.count||0)/total*100);
      html += '<div class="stacked-bar-h" style="height:36px;">';
      html += '<div style="width:'+kp+'%;background:'+C('favourable')+'" title="Kept: '+(kept.count||0)+'">Kept '+kp.toFixed(1)+'%</div>';
      html += '<div style="width:'+dp+'%;background:'+C('adverse')+'" title="Discarded: '+(disc.count||0)+'">Discarded '+dp.toFixed(1)+'%</div>';
      html += '</div>';
      if(disc.reasons){
        html += '<div style="margin-top:8px;font-size:12px;">';
        Object.entries(disc.reasons).forEach(([k,v])=> html += '<span style="margin-right:16px;"><strong>'+esc(k)+':</strong> '+esc(v)+'</span>');
        html += '</div>';
      }
    }
    html += '</div>';
  }

  // Yearly obs chart
  if(m.yearly_observations || m.observations_by_year){
    const yearly = m.yearly_observations || m.observations_by_year;
    html += '<div class="card"><h3>Yearly Observation Count</h3><div class="chart-container"><canvas id="chart-yearly-obs"></canvas></div></div>';
  }

  // Reserve distribution
  if(m.reserve_histogram){
    html += '<div class="card"><h3>Opening Reserves Distribution</h3><div class="chart-container"><canvas id="chart-reserve-hist"></canvas></div>';
    if(m.reserve_histogram.overflow > 0) html += '<p style="color:#6c757d;font-size:0.85rem;">'+m.reserve_histogram.overflow+' observations beyond chart range.</p>';
    const rs = m.reserve_histogram.stats;
    if(rs) html += makeTable(['Statistic','Value'],[
      ['Minimum', fmt(rs.min,1)+' m'], ['Maximum', fmt(rs.max,1)+' m'],
      ['Mean', fmt(rs.mean,1)+' m'], ['Median', fmt(rs.median,1)+' m'],
      ['Std Deviation', fmt(rs.std,1)+' m'], ['Skewness', fmt(rs.skewness,2)],
      ['10th Percentile', fmt(rs.p10,1)+' m'], ['90th Percentile', fmt(rs.p90,1)+' m'],
    ]);
    html += '</div>';
  }

  // HHI distribution
  if(m.hhi_histogram){
    html += '<div class="card"><h3>HHI (Concentration) Distribution</h3><div class="chart-container"><canvas id="chart-hhi-hist"></canvas></div>';
    const hs = m.hhi_histogram.stats;
    if(hs) html += makeTable(['Statistic','Value'],[
      ['Minimum', fmt(hs.min,3)], ['Maximum', fmt(hs.max,3)],
      ['Mean', fmt(hs.mean,3)], ['Median', fmt(hs.median,3)],
      ['Std Deviation', fmt(hs.std,3)], ['Skewness', fmt(hs.skewness,2)],
      ['10th Percentile', fmt(hs.p10,3)], ['90th Percentile', fmt(hs.p90,3)],
    ]);
    html += '</div>';
  }

  // Assumptions
  html += '<div class="card"><h3>Analysis Configuration</h3>';
  html += makeTable(['Parameter','Value'], Object.entries(cfg).map(([k,v])=>[esc(k), esc(typeof v==='object'?JSON.stringify(v):v)]));

  el.innerHTML = html;

  // Draw yearly chart
  const yearly = m.yearly_observations || m.observations_by_year;

  // Draw reserve histogram

        scales:{ x:{ title:{display:true, text:'Opening Reserves (m)'} }, y:{ beginAtZero:true, title:{display:true, text:'Count'} } }
      }

  // Draw HHI histogram

    makeChart('chart-hhi-hist',{
      type:'bar',

// TAB 1: Distribution

function renderTab1(){
  const el = document.getElementById('tab-content-1');
  const dist = DATA.distribution;
  if(!dist){ noData(el); return; }

  let html = '';

  // Stats cards
  if(dist.stats){
    const s = dist.stats;
    html += '<div class="grid-4">';
    html += '<div class="stat-card"><div class="stat-value">'+fmt(s.mean,2)+'%</div><div class="stat-label">Mean PYD%</div></div>';
    html += '<div class="stat-card"><div class="stat-value">'+fmt(s.std,2)+'%</div><div class="stat-label">Std Dev'+(s.min!=null?' ('+fmt(s.min,1)+'..'+fmt(s.max,1)+')':'')+'</div></div>';
    html += '<div class="stat-card"><div class="stat-value">'+fmt(s.q995||s.quantile_995,2)+'%</div><div class="stat-label">99.5% Quantile</div></div>';
    html += '<div class="stat-card"><div class="stat-value">'+fmt(s.median,2)+'%</div><div class="stat-label">Median</div></div>';
    html += '</div>';
  }

  // Reference mean t-test
  if(dist.reference_mean_test){
    const rmt = dist.reference_mean_test;
    const sig = rmt.is_significant;
    html += '<div class="card"><h3>Reference Mean Test (H\u2080: \u03BC = 0)</h3>';
    html += '<p>Is the market mean PYD% significantly different from zero? This determines the reference level for standardised distributions.</p>';
    html += '<div class="grid-4" style="margin-top:8px;">';
    html += '<div class="stat-card"><div class="stat-value">'+fmt(rmt.mean_pyd_pct,2)+'%</div><div class="stat-label">Sample Mean</div></div>';
    html += '<div class="stat-card"><div class="stat-value">'+fmt(rmt.t_statistic,2)+'</div><div class="stat-label">t-statistic</div></div>';
    html += '<div class="stat-card"><div class="stat-value">'+fmt(rmt.p_value,4)+'</div><div class="stat-label">p-value</div></div>';
    html += '<div class="stat-card"><div class="stat-value">'+(sig?'<span class="badge badge-unstable">Significant</span>':'<span class="badge badge-stable">Insignificant</span>')+'</div><div class="stat-label">Result (p '+(sig?'\u2264':'>') +' 0.05)</div></div>';
    html += '</div>';
    html += '<div class="info-msg" style="margin-top:8px;">'+esc(rmt.interpretation)+' All standardised distributions throughout this dashboard are re-centred to this reference mean.</div>';
    html += '</div>';
  }

  // Histogram
  if(dist.pyd_histogram){
    html += '<div class="card"><h3>PYD % Distribution</h3><div class="chart-container"><canvas id="chart-pyd-hist"></canvas></div>'+selectedObsCard('hist')+'</div>';
  }

  // Boxplots
  if(dist.boxplots){
    html += '<div class="grid-2">';
    const bpTypes = [
      ['by_reserves_decile','By Reserves Decile'],
      ['by_hhi_decile','By HHI Decile'],
      ['by_complexity_decile','By Complexity Decile'],
      ['by_year','By Year']
    ];
    bpTypes.forEach(([key,title])=>{
      html += '<div class="card"><h3>'+title+'</h3>';
      if(dist.boxplots[key] && dist.boxplots[key].length > 0){
        html += '<div class="chart-container"><canvas id="chart-bp-'+key+'"></canvas></div>';
      } else {
        html += '<div class="no-data">No data available</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }

  // Decile statistical tests
  if(dist.boxplots && dist.boxplots.decile_tests){
    const dt = dist.boxplots.decile_tests;
    html += '<div class="card"><h3>Decile Statistical Tests</h3>';
    html += '<div class="info-msg">ANOVA tests whether group means differ significantly. Bartlett tests whether group variances differ. A high variance ratio suggests heteroscedasticity across deciles.</div>';
    const dtHeaders = ['Decile Grouping','ANOVA F','ANOVA p','Bartlett chi2','Bartlett p','Variance Ratio'];
    const dtRows = [];
    const dtKeys = [['by_reserves_decile','Reserves'],['by_hhi_decile','HHI'],['by_complexity_decile','Complexity']];
    dtKeys.forEach(([key,label])=>{
      const t = dt[key];
      if(!t) return;
      dtRows.push([
        label,
        fmt(t.anova_f ?? t.anova?.f_stat, 2),
        fmt(t.anova_p ?? t.anova?.p_value, 4) + ((t.anova_p ?? t.anova?.p_value) != null ? ((t.anova_p ?? t.anova?.p_value) <= 0.05 ? ' <span class="badge badge-unstable">Sig</span>' : ' <span class="badge badge-stable">Insig</span>') : ''),
        fmt(t.bartlett_chi2 ?? t.bartlett?.chi2, 2),
        fmt(t.bartlett_p ?? t.bartlett?.p_value, 4) + ((t.bartlett_p ?? t.bartlett?.p_value) != null ? ((t.bartlett_p ?? t.bartlett?.p_value) <= 0.05 ? ' <span class="badge badge-unstable">Sig</span>' : ' <span class="badge badge-stable">Insig</span>') : ''),
        fmt(t.variance_ratio, 2)
      ]);
    });
    if(dtRows.length) html += makeTable(dtHeaders, dtRows);
    html += '</div>';
  }

  el.innerHTML = html;

  // Draw histogram
  if(dist.pyd_histogram){
    const h = dist.pyd_histogram;
    const bins = h.bins || [];
    const counts = h.counts || [];
    if(bins.length < 2){ insufficientData(el); return; }
    const labels = bins.map((b,i)=> typeof b==='string'? b : (b+'%'));
    const bgColors = bins.map((b,i)=>{
      const val = typeof b==='number'? b : parseFloat(b);
      if(i===bins.length-1 && (String(b).includes('+') || String(b).includes('overflow'))) return '#9b59b6';
      return val >= 0 ? C('adverse') : C('favourable');
    });
    makeChart('chart-pyd-hist',{
      type:'bar',
      data:{
        labels, datasets:[{ label:'Count', data:counts, backgroundColor:bgColors }]
      },
      options:{
        indexAxis:'y', responsive:true,
        plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'#333', titleFont:{size:12}, bodyFont:{size:12}, cornerRadius:6 } },
        scales:{ x:{ beginAtZero:true, title:{display:true, text:'Count'} } },
        onClick:(evt, elems)=>{
          if(elems.length){
            const idx = elems[0].index;
            showSelection('hist','<p>Bin: '+esc(labels[idx])+', Count: '+counts[idx]+'</p>');
          }
        }
      }
    });
  }

  // Draw boxplots (simulated with floating bars)
  if(dist.boxplots){
    ['by_reserves_decile','by_hhi_decile','by_complexity_decile','by_year'].forEach(key=>{
      const bp = dist.boxplots[key];
      if(!bp || bp.length < 1) return;
      const labels = bp.map(b=> b.label || b.decile || b.year || '');
      const mins = bp.map(b=> b.min || b.whisker_low || b.q0);
      const q1s = bp.map(b=> b.q1 || b.q25);
      const medians = bp.map(b=> b.median || b.q50);
      const q3s = bp.map(b=> b.q3 || b.q75);
      const maxs = bp.map(b=> b.max || b.whisker_high || b.q100);
      const ns = bp.map(b=> b.n || '');

      makeChart('chart-bp-'+key,{
        type:'bar',
        data:{
          labels,
          datasets:[
            { label:'Whisker Low→Q1', data:bp.map((b,i)=>[ mins[i], q1s[i] ]), backgroundColor:'rgba(33,102,172,0.15)', borderColor:'transparent' },
            { label:'Q1→Median', data:bp.map((b,i)=>[ q1s[i], medians[i] ]), backgroundColor:C('raw'), borderColor:C('raw') },
            { label:'Median→Q3', data:bp.map((b,i)=>[ medians[i], q3s[i] ]), backgroundColor:C('raw'), borderColor:C('raw') },
            { label:'Q3→Whisker High', data:bp.map((b,i)=>[ q3s[i], maxs[i] ]), backgroundColor:'rgba(33,102,172,0.15)', borderColor:'transparent' }
          ]
        },
        options:{
          responsive:true, plugins:{ legend:{display:false},
            tooltip:{ callbacks:{ label:function(ctx){
              const i = ctx.dataIndex;
              return 'Min:'+fmt(mins[i])+' Q1:'+fmt(q1s[i])+' Med:'+fmt(medians[i])+' Q3:'+fmt(q3s[i])+' Max:'+fmt(maxs[i])+(ns[i]?' n='+ns[i]:'');
            }}, backgroundColor:'#333', cornerRadius:6 }
          },
          scales:{
            x:{ stacked:true },
            y:{ stacked:true, title:{display:true, text:'PYD %'} }
          },
          plugins2:{
            annotation:{ annotations:{ line1:{ type:'line', yMin:0, yMax:0, borderColor:'black', borderDash:[5,5], borderWidth:1 } } }
          }
        }
      });
    });
  }
}

// ============================================================
// TAB 3: Tail Diagnostics
// ============================================================
function renderTab3(){
  const el = document.getElementById('tab-content-3');
  const td = DATA.tail_diagnostics;
  if(!td){ noData(el); return; }

  let html = '<div class="card"><h3>Mean Excess Plot</h3><div class="chart-container"><canvas id="chart-mean-excess"></canvas></div>'+selectedObsCard('mep')+'</div>';
  html += '<div class="info-msg">The Mean Excess Function (MEF) plots the expected excess above a threshold, conditional on exceeding it. <strong>Look for linearity</strong>: a straight line suggests an exponential tail; an upward slope suggests a heavier-than-exponential (e.g. Pareto) tail. If the standardised (mix-adjusted) MEF is flatter or lower than the raw MEF, composition adjustment is reducing tail risk. Instability at high thresholds reflects small sample sizes.</div>';
  html += '<div class="info-msg">The <strong>Standardised</strong> line adjusts each syndicate-year\'s severity for both <em>LoB mix</em> and <em>portfolio size</em>, then <strong>re-centres</strong> the distribution to preserve the market mean. Each observation is reweighted to a common LoB mix and size-adjusted to a reference reserve level, but the overall mean is held fixed at the market reference mean (since ANOVA shows means do not vary significantly by size or complexity). This isolates the effect of standardisation on <em>dispersion</em> (tail behaviour) without introducing a spurious mean shift from Jensen\'s inequality.</div>';
  el.innerHTML = html;

  // Support multiple JSON shapes: td.raw (array), td.mean_excess.raw.thresholds/values, td.raw.mean_excess_function
  let rawPts = [];
  let stdPts = [];
  if(td.mean_excess && td.mean_excess.raw && td.mean_excess.raw.thresholds){
    rawPts = td.mean_excess.raw.thresholds.map((t,i)=>({threshold:t, mean_excess:td.mean_excess.raw.values[i]}));
  } else if(Array.isArray(td.raw)){
    rawPts = td.raw;
  } else if(td.raw && td.raw.mean_excess_function){
    rawPts = td.raw.mean_excess_function;
  }
  if(td.mean_excess && td.mean_excess.standardised && td.mean_excess.standardised.thresholds){
    stdPts = td.mean_excess.standardised.thresholds.map((t,i)=>({threshold:t, mean_excess:td.mean_excess.standardised.values[i]}));
  } else if(Array.isArray(td.standardised)){
    stdPts = td.standardised;
  } else if(td.mix_standardised && Array.isArray(td.mix_standardised)){
    stdPts = td.mix_standardised;
  } else if(td.mix_standardised && td.mix_standardised.mean_excess_function){
    stdPts = td.mix_standardised.mean_excess_function;
  }
  if(rawPts.length < 2 && stdPts.length < 2){ insufficientData(el); return; }

  const datasets = [];
  if(rawPts.length){
    datasets.push({
      label:'Raw', data:rawPts.map(p=>({x:p.threshold||p.x, y:p.mean_excess||p.y})),
      borderColor:C('raw'), backgroundColor:C('raw'),
      showLine:true, pointRadius:3, tension:0.1
    });
  }
  if(stdPts.length){
    datasets.push({
      label:'Standardised', data:stdPts.map(p=>({x:p.threshold||p.x, y:p.mean_excess||p.y})),
      borderColor:C('standardised'), backgroundColor:C('standardised'),
      showLine:true, pointRadius:3, tension:0.1
    });
  }

  makeChart('chart-mean-excess',{
    type:'scatter',
    data:{ datasets },
    options:{
      responsive:true,
      plugins:{ tooltip:{ backgroundColor:'#333', cornerRadius:6 } },
      scales:{
        x:{ title:{display:true, text:'Threshold'} },
        y:{ title:{display:true, text:'Mean Excess'} }
      },
      onClick:(evt, elems)=>{
        if(elems.length){
          const pt = elems[0];
          const d = datasets[pt.datasetIndex].data[pt.index];
          showSelection('mep','<p>Threshold: '+fmt(d.x,4)+', Mean Excess: '+fmt(d.y,4)+' ('+datasets[pt.datasetIndex].label+')</p>');
        }
      }
    }
  });
}

// ============================================================
// TAB 4: Size Scaling
// ============================================================
function renderTab4(){
  const el = document.getElementById('tab-content-4');
  const ss = DATA.size_scaling;
  if(!ss){ noData(el); return; }

  let html = '';

  // ── SECTION 1: Direction ──────────────────────────────────
  html += '<h2 style="margin:1.5rem 0 0.5rem;border-bottom:2px solid #dee2e6;padding-bottom:0.4rem;">Does Size Affect the Direction of PYD?</h2>';
  html += '<p style="color:#6c757d;margin-bottom:1rem;">Tests whether larger syndicates systematically run positive or negative reserve development (mean shift).</p>';

  // Scatter with quantile lines
  if(ss.scatter_data){
    html += '<div class="card"><h3>Size vs PYD Severity (Log-Log)</h3><div class="chart-container"><canvas id="chart-size-scatter"></canvas></div>'+selectedObsCard('ssc')+'</div>';
  }

  // Primary estimator
  if(ss.primary || ss.primary_estimator || ss.re_gls){
    const pe = ss.primary || ss.primary_estimator || ss.re_gls || {};
    html += '<div class="card"><h3>Primary RE-GLS Estimator (Mean Direction)</h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">Random-effects GLS with syndicate intercepts and event fixed effects. Tests whether mean PYD severity shifts with portfolio size.</p>';
    html += makeTable(['Param','Value'],[
      ['Beta (&beta;)', fmt(pe.beta||pe.coefficient, 4)],
      ['Std Error', fmt(pe.se||pe.std_error, 4)],
      ['p-value', fmt(pe.p_value, 6)],
      ['95% CI', pe.ci_95? '['+fmt(pe.ci_95[0],4)+', '+fmt(pe.ci_95[1],4)+']':'N/A']
    ]);
    const pv = pe.p_value;
    const verdict = (pv!=null && pv < 0.05) ? '<span style="color:#dc3545;font-weight:600;">Significant mean shift detected.</span>' : '<span style="color:#28a745;font-weight:600;">No significant mean shift — size does not bias PYD direction.</span>';
    html += '<p style="margin-top:0.5rem;">'+verdict+'</p>';
    html += '</div>';
  }

  // Direction models from frequentist comparison (mean-shift models only)
  if(ss.frequentist_comparison || ss.model_comparison){
    const fc = ss.frequentist_comparison || ss.model_comparison || [];
    const fcArr = Array.isArray(fc)?fc:Object.entries(fc).map(([k,v])=>({model:k,...v}));
    const dirModels = fcArr.filter(m=>{const s=m.spec||m.model||''; return s.toLowerCase().includes('mean');});
    if(dirModels.length){
      html += '<div class="card"><h3>Direction Models (Mean Shift)</h3>';
      html += '<p style="color:#6c757d;font-size:0.9rem;">Do larger syndicates have systematically higher or lower PYD? All models test β in: severity ~ β·ln(reserves).</p>';
      const headers = ['Model','Beta (&beta;)','Std Error','p-value','AIC','BIC',''];
      const rows = dirModels.map(m=>[
        esc(m.spec||m.model||m.name), fmt(m.beta||m.coefficient,4), fmt(m.se||m.std_error,4),
        fmt(m.p_value,6), fmt(m.aic,1), fmt(m.bic,1),
        esc(m.sig_marker||'')
      ]);
      html += makeTable(headers, rows);
      html += '</div>';
    }
  }

  // ── SECTION 2: Dispersion ─────────────────────────────────
  html += '<h2 style="margin:2rem 0 0.5rem;border-bottom:2px solid #dc3545;padding-bottom:0.4rem;color:#dc3545;">Does Size Affect the Dispersion of PYD?</h2>';
  html += '<p style="color:#6c757d;margin-bottom:1rem;">Tests whether larger syndicates exhibit lower volatility (diversification benefit). This is the key finding for capital calibration.</p>';

  // Dispersion models
  if(ss.frequentist_comparison || ss.model_comparison){
    const fc = ss.frequentist_comparison || ss.model_comparison || [];
    const fcArr = Array.isArray(fc)?fc:Object.entries(fc).map(([k,v])=>({model:k,...v}));
    const dispModels = fcArr.filter(m=>{const s=m.spec||m.model||''; return s.toLowerCase().includes('absolute') || s.toLowerCase().includes('dispersion');});
    if(dispModels.length){
      html += '<div class="card"><h3>Dispersion Models (Volatility Scaling)</h3>';
      html += '<p style="color:#6c757d;font-size:0.9rem;">Do larger syndicates have lower PYD volatility? Negative β = diversification benefit (less volatile per unit of reserve).</p>';
      const headers = ['Model','Beta (&beta;)','Std Error','p-value','AIC','BIC',''];
      const rows = dispModels.map(m=>[
        esc(m.spec||m.model||m.name), fmt(m.beta||m.coefficient,4), fmt(m.se||m.std_error,4),
        fmt(m.p_value,6), fmt(m.aic,1), fmt(m.bic,1),
        esc(m.sig_marker||'')
      ]);
      html += makeTable(headers, rows);
      const allSig = dispModels.every(m=>(m.p_value!=null && m.p_value < 0.01));
      if(allSig){
        html += '<p style="margin-top:0.5rem;"><span style="color:#dc3545;font-weight:600;">Strong diversification benefit confirmed — larger syndicates have significantly lower PYD volatility.</span></p>';
      }
      html += '</div>';
    }
  }

  // Power-law size dispersion model
  const dmR = DATA.exposure_composition && DATA.exposure_composition.dispersion_models && DATA.exposure_composition.dispersion_models.single_r;
  if(dmR && dmR.status==='fitted'){
    html += '<div class="card"><h3>Power-Law Dispersion: s\u00b2 = A + B\u00b7R<sup>C</sup></h3>';
    html += '<p style="color:#6c757d;font-size:0.9rem;">Fits winsorised s\u00b2 (capped at p'+fmt(95,0)+') as a monotonically decreasing power-law in reserves.</p>';
    html += '<div class="chart-container"><canvas id="chart-disp-r"></canvas></div>';
    html += '<p style="color:#6c757d;font-size:0.85rem;">Parameters estimated on '+(dmR.n_bins||10)+' decile means (robust to heavy tails). Winsorised at p95 (cap='+fmt(dmR.winsorise_cap,4)+').</p>';
    html += makeTable(['Param','Value','p-value'],[
      ['A (variance floor)', fmt(dmR.A,6)+ci95(dmR.A,dmR.se_A,0), dmR.p_A!=null?fmt(dmR.p_A,6):'—'],
      ['B (diversifiable scale)', fmt(dmR.B,6)+ci95(dmR.B,dmR.se_B,0), dmR.p_B!=null?fmt(dmR.p_B,6):'—'],
      ['C (power)', fmtC(dmR), dmR.p_C!=null?fmt(dmR.p_C,6):'—'],
      ['R\u00b2 (decile means)', fmt(dmR.r_squared,4), ''],
      ['R\u00b2 (observation-level)', fmt(dmR.r_squared_obs,4), ''],
      ['Interpretation', 'Doubling reserves multiplies variance by '+fmt(Math.pow(2,dmR.C),2)+'\u00d7', ''],
    ]);
    html += '</div>';
  }

  // Event group audit
  if(ss.event_group_audit){
    html += '<div class="card"><div class="collapsible-header" onclick="toggleCollapse(this)">Event Group Audit</div><div class="collapsible-body">';
    const ega = ss.event_group_audit;
    const egArr = Array.isArray(ega)?ega:Object.entries(ega).map(([k,v])=>({group:k,...v}));
    if(egArr.length){
      const headers = Object.keys(egArr[0]);
      const rows = egArr.map(r=> headers.map(h=> esc(r[h])));
      html += makeTable(headers.map(esc), rows);
    }
    html += '</div></div>';
  }

  el.innerHTML = html;

  // Draw scatter
  if(ss.scatter_data){
    const pts = ss.scatter_data.points || ss.scatter_data || [];
    if(pts.length < 2){ return; }
    const scatterData = pts.map(p=>({x:p.x, y:p.y, syndicate:p.syndicate, year:p.year, cause:p.cause}));
    const xs = scatterData.map(d=>d.x).sort((a,b)=>a-b);
    const xmin = xs[0], xmax = xs[xs.length-1];

    const datasets = [{
      label:'Observations', data:scatterData,
      backgroundColor:'rgba(108,117,125,0.3)', borderColor:'transparent',
      pointRadius:3, pointHoverRadius:5
    }];

    // Mean regression line
    if(ss.scatter_data.regression_line || ss.primary || ss.primary_estimator || ss.re_gls){
      const pe = ss.scatter_data.regression_line || ss.primary || ss.primary_estimator || ss.re_gls || {};
      if(pe.intercept!=null && (pe.slope!=null || pe.beta!=null)){
        const slope = pe.slope || pe.beta;
        datasets.push({
          label:'Mean (RE-GLS)', data:[{x:xmin,y:pe.intercept+slope*xmin},{x:xmax,y:pe.intercept+slope*xmax}],
          type:'scatter', showLine:true, borderColor:C('standardised'), backgroundColor:'transparent',
          pointRadius:0, borderWidth:2
        });
      }
    }

    // Binned empirical quantile curves (90th and 10th)
    const qb = ss.scatter_data.quantile_bins;
    if(qb && qb.length > 1){
      datasets.push({
        label:'90th percentile', data:qb.map(b=>({x:b.x, y:b.q90})),
        type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent',
        pointRadius:3, borderWidth:2, borderDash:[6,3], tension:0.3
      });
      datasets.push({
        label:'10th percentile', data:qb.map(b=>({x:b.x, y:b.q10})),
        type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent',
        pointRadius:3, borderWidth:2, borderDash:[6,3], tension:0.3
      });
    }

    makeChart('chart-size-scatter',{
      type:'scatter',
      data:{ datasets },
      options:{
        responsive:true,
        plugins:{ tooltip:{
          backgroundColor:'#333', cornerRadius:6,
          callbacks:{ label:ctx=>{
            const d = ctx.raw;
            return (d.syndicate?'Syn '+d.syndicate:'')+(d.year?' ('+d.year+')':'')+' x:'+fmt(d.x,2)+' y:'+fmt(d.y,2);
          }}
        }},
        scales:{
          x:{ title:{display:true, text:'Log(Reserve Size)'} },
          y:{ title:{display:true, text:'PYD Severity'} }
        },
        onClick:(evt, elems)=>{
          if(elems.length && elems[0].datasetIndex===0){
            const d = scatterData[elems[0].index];
            showSelection('ssc','<p>Syndicate: '+esc(d.syndicate)+', Year: '+esc(d.year)+', x: '+fmt(d.x,3)+', y: '+fmt(d.y,3)+(d.cause?', Cause: '+esc(d.cause):'')+'</p>');
          }
        }
      }
    });
  }

  // Draw size dispersion power-law chart
  if(dmR && dmR.status==='fitted' && dmR.fitted_curve){
    const ssPts = ss.scatter_data && ss.scatter_data.points;
    if(ssPts){
      const xR = ssPts.map(p=>Math.exp(p.x));
      const ySqR = ssPts.map(p=>p.y*p.y);
      const scData = xR.map((x,i)=>({x, y:ySqR[i]}));
      const dsets = [
        { label:'Observations (s\u00b2)', data:scData, backgroundColor:'rgba(108,117,125,0.2)', borderColor:'transparent', pointRadius:2, pointHoverRadius:4 },
        { label:'Fitted (decile means)', data:dmR.fitted_curve.map(p=>({x:p.x,y:p.y})), type:'scatter', showLine:true, borderColor:'#dc3545', backgroundColor:'transparent', pointRadius:0, borderWidth:2.5, tension:0.4 }
      ];
      if(dmR.bin_points && dmR.bin_points.length){
        dsets.push({ label:'Bin means (n\u224818)', data:dmR.bin_points.map(p=>({x:p.x,y:p.y})), backgroundColor:C('raw'), borderColor:C('raw'), pointRadius:5, pointHoverRadius:7 });
      }
      makeChart('chart-disp-r',{
        type:'scatter', data:{ datasets:dsets },
        options:{ responsive:true,
          plugins:{ tooltip:{ backgroundColor:'#333', cornerRadius:6 }},
          scales:{ x:{ title:{display:true, text:'Opening Reserves (\u00a3m)'} }, y:{ type:'sqrt', title:{display:true, text:'s\u00b2 (squared severity, \u221a scale)'}, min:0 } }
        }
      });
    }
  }

}

function toggleCollapse(el){
  el.classList.toggle('open');
  const body = el.nextElementSibling;
  body.classList.toggle('open');
}

// TAB 5: Exposure Composition
// ============================================================
function renderTabExposure(){
  const el = document.getElementById('tab-content-5');
  const ec = DATA.exposure_composition;
  if(!ec){ noData(el); return; }

  let html = '';

  // ── SECTION 1: HHI Diversification ────────────────────────
  html += '<h2 style="margin:1.5rem 0 0.5rem;border-bottom:2px solid #dee2e6;padding-bottom:0.4rem;">Diversification vs PYD Volatility</h2>';
  html += '<p style="color:#6c757d;margin-bottom:1rem;">Does LoB diversification (measured by 1&minus;HHI) reduce PYD volatility? Higher values indicate more diversified portfolios.</p>';

  // HHI scatter
  if(ec.hhi_scatter && ec.hhi_scatter.points && ec.hhi_scatter.points.length > 1){
    html += '<div class="card"><h3>Diversification (1 &minus; HHI) vs PYD Severity</h3><div class="chart-container"><canvas id="chart-hhi-scatter"></canvas></div>'+selectedObsCard('hsc')+'</div>';
  }

  // Direction test only (dispersion is now handled by power-law models)
  if(ec.hhi_scatter){
    const dir = ec.hhi_scatter.direction || {};
    html += '<div class="card"><h3>Direction Test (Mean Shift)</h3>';
    html += makeTable(['Test','Beta (&beta;)','Std Error','p-value','Interpretation'],[
      ['Severity ~ &beta;&middot;(1&minus;HHI)', fmt(dir.beta,4), fmt(dir.se,4), fmt(dir.p_value,6),
        (dir.p_value!=null && dir.p_value<0.05)?'<span style="color:#dc3545;">Significant mean shift</span>':'<span style="color:#28a745;">No mean shift</span>'],
